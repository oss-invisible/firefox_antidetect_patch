# ─────────────────────────────────────────────────────────────────────────────
# release.yml — build both patched-Firefox targets (Windows and Linux, x86_64) and publish them as
# DRAFT GitHub Release assets, named per the wrapper contract (constants.ARCHIVE_NAME).
# DRAFT on purpose: a human runs the realness gate and only THEN un-drafts + bumps
# BINARY_VERSION. Nothing auto-ships (issue #14 lesson).
#
# PACKAGING (issue #14: dangling symlinks broke 265 downloads — never again):
#   Linux → cp -aL (dereference ALL symlinks into real files) + rm dev tools +
#           strip + sanitize + tar at ROOT, then validate_release.py as a HARD
#           in-pipeline gate (the exact battle-tested script from the source repo).
#   Win   → mach package; zip the CONTENTS of dist/firefox (clean tree, NOT
#           dist/bin) so firefox.exe sits at the zip ROOT.
#
# DRIVE GATE (the firefox-8 catcher): after build, every binary is DRIVEN by
# Playwright on its native runner (launch via juggler + real page + JS roundtrip,
# headless, no screenshot → GPU-free, zero proxy). A juggler-less binary renders
# a screenshot fine but is undrivable — only an actual drive catches that. The
# proxy realness gate (fppro/webrtc) stays LOCAL — it needs secrets.
#
# Trigger: by hand from main for a release; by itself, as a CANDIDATE with the gtests,
# on every push to main and once a week (scripts/release_plan.py says why: the compile
# cache lives per branch and dies after seven days unused, so main's cache stays warm
# and a release is 43 min, never the 75 of a cold one; measured 2026-11-07). A run by
# hand is a CANDIDATE (build + gate, nothing published, a green run) unless it says
# kind=release; the `plan` job decides, once, before any build, and every job reads
# its outputs: the gtests and the refs come from the plan, never from the inputs,
# which an automatic run does not have.
#
# WHO COMPILES: the two x86_64 legs ONLY on Latitude.sh servers, at the same time, each on its
# own, on a single-job runner with a label of its own. No linux-arm64 from firefox-56 on
# (owner's decision, 2026-11-04): always both legs, no choice. Gates and tests stay on GitHub's runners, with the
# binaries from the artifacts. `node` turns the nodes on: if either cannot, the run fails.
# `watch-*` turn each node off as its leg ends, and re-launch the run once if a machine is
# lost; `stop-node` makes sure both are off. All on GitHub's runners with the API key, which
# never reaches a node (scripts/ci/latitude_node.py, scripts/ci/test_release_builder.py).
# ─────────────────────────────────────────────────────────────────────────────
name: release
# A re-launch says so where the watch of the run it replaces can find it (latitude_node.py).
run-name: ${{ inputs.relaunch_of && inputs.relaunch_of != '' && format('release, relaunch of {0}', inputs.relaunch_of) || (github.event_name == 'workflow_dispatch' && 'release') || format('candidate on {0} ({1})', github.ref_name, github.event_name) }}

on:
  # A candidate with the gtests, with the compile cache: keeps main's cache warm.
  push:
    branches: [main]
    # Documentation builds nothing: a commit that touches only Markdown runs no candidate.
    paths-ignore: ["**.md"]
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC: a week unused and the cache is gone
  workflow_dispatch:
    inputs:
      kind:
        description: >
          candidate: build and gate, publish nothing (no seal, no draft); its
          archives stay the run's artifacts, and republish.yml publishes them
          from its run id. release: also the seal and the DRAFT under
          release_tag.
        type: choice
        options: [candidate, release]
        default: candidate
      release_tag:
        description: 'firefox-N to publish the draft under; kind=release only, a candidate refuses one'
        required: false
        default: ''
      compile_cache:
        description: >
          gha: compile through sccache on the GitHub Actions cache, so a run after
          a fix recompiles only what changed (the plan's default). off: a cold
          build.
        type: choice
        options: ['gha', 'off']
        default: 'gha'
      wrapper_ref:
        description: >
          invisible_playwright ref the gate runs against. Defaults to main,
          which is what will be published next and therefore the right thing to
          validate a new binary with. Set it to a published TAG while the
          wrapper is mid-rewrite: otherwise unfinished work on main blocks a
          binary release that has nothing to do with it.
        default: 'main'
      core_ref:
        description: >
          invisible_core ref the gate installs. Defaults to main, for the reason
          the gate step gives. Set it to the branch that follows a change of the
          engine's layout (firefox-47 moved the juggler to modules/juggler):
          main still reads the old one and refuses every launch. The core is
          installed before the wrapper, so wrapper_ref must pin the version this
          ref builds.
        default: ''
      stop_after:
        description: >
          objects: the compile-only candidate. Each leg compiles the objects of every
          directory the series touches (all the errors of all of them, in the summary)
          and stops: no link, no package, no gtests, no gate. Only a candidate on a
          latitude/* branch; the plan refuses it anywhere else. Empty: the whole run.
        type: string
        default: ''
      gtests:
        description: >
          Also run the engine's gtests on every leg, after its package and
          symbols. They link a second libxul with the same LTO and PGO, about an
          hour more a leg: off by default, for the CANDIDATE before a release. A
          cold release leg already fills most of the job's 350 minutes on Windows.
        type: boolean
        default: false
      gtest_filter:
        # What the last green gtests ran (run 41402916724), and the suites of ours added since: EVERY suite of our own files is here (the
        # list of them: git grep for TEST(Stealth*, TEST(Idwr, and every suite of ours that sits in a Mozilla directory's gtest: StealthStartupCache).
        # A suite that exists on one platform only is named all the same: scripts/ci/gtest_run.py knows which (NOT_ON). * has never gone green here.
        description: "gtests=true only: which, as mach gtest takes them; * is all, and unproven"
        default: 'StealthGfxFeatureStatus.*:StealthWebGPUAdapter.*:StealthWebGPUDeclaration.*:StealthWebGPUBundledVulkan.*:StealthWebGPUInstanceEnv.*:StealthFullscreen.*:StealthScaleDeclaration.*:StealthWindowGeometry.*:StealthGLMultisample.*:StealthWebGLParams.*:StealthFrameCrash.*:StealthJugglerEventId.*:StealthSessionUdpProxy.*:StealthDeclaredNetwork.*:StealthSocksUdpPool.*:TestStealthTRRContext.*:TestStealthSocksCredentials.*:TestStealthSessionResolver.*:StealthIceResolverContext.*:StealthUdpProxyBirth.*:StealthNrSocketBirth.*:StealthPcUdpProxyKinds.*:StealthTcpProxyRoad.*:StealthPcProxyConfig.*:StealthInputEventBirth.*:StealthKeyBirthScope.*:StealthBirthOrder.*:StealthFcBundleFonts.*:StealthAudioNoise.*:StealthBundledCollection.*:StealthGlyphCoverage.*:StealthBundleHooks.*:StealthFontListHooks.*:StealthDebugger.*:StealthWindowInputDesktop.*:StealthPrefSanitize.*:TestStealthLinkClickAfter.*:TestStealthLoadInfo.*:TestStealthDocShellDefaults.*:StealthCanvasProjection.*:StealthDocumentLanguage.*:StealthFallbackNames.*:StealthFcFontList.*:StealthFontList.*:StealthFontMetrics.*:StealthMediaDeclaration.*:StealthOwnBinaries.*:StealthQuotaEstimate.*:StealthTextQuality.*:StealthTtcFace.*:StealthWebGPUExternalTexture.*:Intl_Locale_StealthSystemLocales.*:Idwr.*:StealthBranding.*:StealthCanvasUtils.*:StealthDragGesture.*:StealthHttp3Socks.*:StealthJugglerCoalesce.*:StealthJugglerMouseAck.*:StealthMouseEventCopy.*:StealthMouseEventIPC.*:StealthNsProxyInfoKinds.*:StealthSocksUdpLayer.*:StealthStackFrames.*:StealthStartupCache.*:StealthTimezone.*:StealthExclusivePort.*:StealthCallerObject.*:StealthSurfaceFlags.*:StealthMediaEnumeration.*:StealthCanvasPageSnapshot.*:TestStealthLookupLoadInfo.*:StealthScreenToReal.*:StealthChromeOffset.*'
      relaunch_of:
        description: >
          Set by the watch of a run whose machine was lost, to that run's id: this run
          is its one re-launch, and losing the machine again fails it. Not for a run by hand.
        default: ''

# Each job asks for what it needs.
permissions: { contents: read }

# "A new push cancels the old run": a CANDIDATE (a push, the weekly run, a dispatch of a candidate) shares one group with the other
# candidates of its branch, and a newer one cancels the older that is still running, node and all (`stop-node` turns it off). A RELEASE and a
# RE-LAUNCH have a group of their own, per run: no push cancels a release, and a re-launch does not cancel the run it replaces, which is still
# reporting. republish.yml is another workflow and has no group.
concurrency:
  group: ${{ (inputs.kind == 'release' && format('release-{0}', github.run_id)) || (inputs.relaunch_of && format('relaunch-{0}', github.run_id)) || format('candidate-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.kind != 'release' && !inputs.relaunch_of }}

# What gets built: this repository holds the patch series only. Every job that
# needs the engine's source rebuilds it with tools/engine.py materialize: the
# Mozilla tag named in UPSTREAM.json, fetched from Mozilla's repository, plus the
# series applied as one commit per folder (dated like the tag, so the commit is the
# same on every runner and on any machine that applies the same series).
jobs:
  # What this run is, decided once and before the builds: a release with a bad
  # tag is refused here in seconds, not at the seal two hours later, and a
  # candidate never reaches the seal at all.
  plan:
    runs-on: ubuntu-24.04
    # `actions: read` to look at the runs and the artifacts of the repository (scripts/ci/reuse_run.py).
    permissions: { actions: read, contents: read }
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      tag: ${{ steps.plan.outputs.tag }}
      num: ${{ steps.plan.outputs.num }}
      prevtag: ${{ steps.plan.outputs.prevtag }}
      seal_tag: ${{ steps.plan.outputs.seal_tag }}
      compile_cache: ${{ steps.plan.outputs.compile_cache }}
      # The gtests and the refs, from the plan: an automatic run has no inputs.
      gtests: ${{ steps.plan.outputs.gtests }}
      gtest_filter: ${{ steps.plan.outputs.gtest_filter }}
      # objects: the legs stop after the objects of the directories the series touches (scripts/release_plan.py).
      stop_after: ${{ steps.plan.outputs.stop_after }}
      core_ref: ${{ steps.plan.outputs.core_ref }}
      wrapper_ref: ${{ steps.plan.outputs.wrapper_ref }}
      build_date: ${{ steps.build_date.outputs.build_date }}
      # The green run whose build is this tree, when there is one (scripts/ci/reuse_run.py): empty, the run builds.
      reuse_run_id: ${{ steps.reuse.outputs.reuse_run_id }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      # What a leg's runs-on needs, known here so that it reads no matrix job's output, which
      # overwrite each other. A rerun of failed jobs reuses it: it no longer matches.
      attempt: ${{ github.run_attempt }}
      node_label: latitude-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into .
      # The engine a candidate would become: the last published firefox-N plus one. The gate seals a candidate
      # firefox-N-candidate, and the wrapper's tests read N from the seal (scripts/release_plan.py says why).
      - name: The last published release
        id: last_release
        run: |
          set -e
          LAST=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}" 'refs/tags/firefox-*' \
            | sed 's#.*refs/tags/firefox-##' | grep -E '^[0-9]+$' | sort -n | tail -1)
          [ -n "$LAST" ] || { echo "ERROR: no firefox-N tag in ${GITHUB_REPOSITORY}: the number of the next engine is unknown"; exit 1; }
          echo "last_release=$LAST" | tee -a "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          # A push candidate with no core_ref tests the core its wrapper_ref pins: the plan reads the wrapper's pyproject.toml through the API (scripts/release_plan.py).
          GH_TOKEN: ${{ github.token }}
          LAST_RELEASE: ${{ steps.last_release.outputs.last_release }}
          EVENT: ${{ github.event_name }}
          KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMPILE_CACHE: ${{ inputs.compile_cache }}
          GTESTS: ${{ inputs.gtests }}
          GTEST_FILTER: ${{ inputs.gtest_filter }}
          CORE_REF: ${{ inputs.core_ref }}
          WRAPPER_REF: ${{ inputs.wrapper_ref }}
          STOP_AFTER: ${{ inputs.stop_after }}
        run: |
          set -e
          python3 scripts/release_plan.py --event "$EVENT" --kind "$KIND" \
            --release-tag "$RELEASE_TAG" --ref-name "$REF_NAME" \
            --compile-cache "$COMPILE_CACHE" --ref-type "$REF_TYPE" \
            --gtests "$GTESTS" --gtest-filter "$GTEST_FILTER" \
            --core-ref "$CORE_REF" --wrapper-ref "$WRAPPER_REF" \
            --stop-after "$STOP_AFTER" --last-release "$LAST_RELEASE" > plan.txt
          cat plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
      # A push to main whose tree a green run has already compiled does not compile it again: the gate runs again, on those bytes, with today's refs
      # (the `gate-reuse` job below, as republish.yml does by hand). Only that case: scripts/ci/reuse_run.py says what else it needs (artifacts alive,
      # gtests done, never the weekly run, never a release). It reads the tree object of what plan has just materialized.
      - name: A green run built this tree already (a push to main only)
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          KIND: ${{ steps.plan.outputs.kind }}
          GTESTS: ${{ steps.plan.outputs.gtests }}
          GTEST_FILTER: ${{ steps.plan.outputs.gtest_filter }}
        run: |
          python3 scripts/ci/reuse_run.py --event "$EVENT" --ref "$REF" --kind "$KIND" --gtests "$GTESTS" --gtest-filter "$GTEST_FILTER" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --tree "$(git rev-parse 'HEAD^{tree}')" --commit "$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
      # ONE BuildID for the whole run, as a retail release has one on every
      # platform: the build graph generates buildid.h more than once per build
      # from 157, and without MOZ_BUILD_DATE each generation takes the clock
      # (see the .mozconfig, which takes this value when it is set).
      - name: One build date for every leg
        id: build_date
        run: echo "build_date=$(date -u +%Y%m%d%H%M%S)" | tee -a "$GITHUB_OUTPUT"
      # The legs, from scripts/ci/legs.py: runners, targets, and the asset
      # names derived from the version the tree builds (never written here).
      - name: The legs and their asset names
        id: matrix
        run: echo "matrix=$(python3 scripts/ci matrix)" | tee -a "$GITHUB_OUTPUT"

  # Every check that guards main, BEFORE a node is turned on (a server is an hour paid whatever it does): checks.yml, the same file series.yml
  # calls on every pull request and every push to main. Nothing is first run on main (docs/decisions/ci-07 of the series). It holds the series'
  # rules, the proof that the series gives the declared tree, the births, the core's checks, the noreply identity, the plan's own tests and what does not
  # read the binary (asset names, upstream source, build files, Juggler's tests, the release scripts). A candidate on a latitude/* branch, a push to
  # main, the weekly run and a release all run it: no `if` skips it. It starts after the `plan` (it takes the core the plan resolved); the node waits for both.
  checks:
    needs: plan
    uses: ./.github/workflows/checks.yml
    permissions: { contents: read }
    with:
      wrapper_ref: ${{ inputs.wrapper_ref || 'main' }}
      # The core the run tests, as the plan resolved it: checks.yml's `core-ref` must not look for the core of the wrapper's pin when the run gives another.
      core_ref: ${{ needs.plan.outputs.core_ref }}

  # The guard that a newer push has not replaced this run (scripts/ci/still_head.py): after the checks, before the node, as the last step of
  # `checks` used to be. It is here and not in checks.yml: it needs `actions: write` to cancel this very run (a called workflow cannot hold more
  # permissions than its caller gives it, and this job is the only one that has them), the node must wait for it, and it means nothing for a pull request.
  still-head:
    name: still-head
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `actions: write` to cancel this very run, and nothing else; no secret.
    permissions: { actions: write, contents: read }
    steps:
      - name: The guard's script, from the series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: .series
          fetch-depth: 1
          sparse-checkout: platform/ci/src/scripts/ci/still_head.py
          sparse-checkout-cone-mode: false
      # A newer push to the branch has replaced this candidate (the rule is "a new push cancels the old run"; the `concurrency` above
      # cancels a run that a newer one finds in progress, this catches the one that was queued behind it). Cancelled HERE, before `node` starts:
      # the sleep keeps this job running until the cancel has landed, because a job that ended would let the node start. Exit 2 (the head could
      # not be read) goes on.
      - name: Still the head of the branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          KIND: ${{ inputs.kind }}
          RELAUNCH_OF: ${{ inputs.relaunch_of }}
        run: |
          set +e
          python3 .series/platform/ci/src/scripts/ci/still_head.py --event "$EVENT" --ref "$REF" --sha "$SHA" --kind "$KIND" --relaunch-of "$RELAUNCH_OF" --repository "$GITHUB_REPOSITORY"
          CODE=$?
          if [ "$CODE" = 1 ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
            sleep 240
            exit 1
          fi
          exit 0

  # THE ARTIFACT `junit-py`, one for the run (an artifact name is one per run, and two jobs write python junit): the parts of every job that runs python tests
  # of ours, `junitpart-py-<job>` (`checks`: the tests of the tree; `package-ab`: the series' tools/tests), put together as junit-py/<job>/<file>.xml. The
  # judge reads `junit-*` folders by their name, so a part is `junitpart-*`, which it does not read. After the checks and the gate (whichever of the two
  # gates this run has), whatever they said; its steps do not fail it. Whoever lists the jobs the judge waits for (`hook-tests-judge`) lists this one.
  junit-py:
    name: junit-py
    needs: [checks, gate, gate-reuse]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job's python junit
        # continue-on-error: an optional download (a job that never got to upload its part leaves none); the judge is red for a named test with no junit
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: junitpart-py-*
          path: junit-py
          merge-multiple: true
      - name: Keep junit-py
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-py
          path: junit-py
          if-no-files-found: ignore
          retention-days: 14

  # Turns each leg's node on, on its own machine (scripts/ci/latitude_node.py). If either
  # cannot, the run fails: nothing else compiles a leg, the build is skipped, and
  # stop-node turns off what did come up. fail-fast is off so that
  # the run names every machine it could not have. The legs are test_release_builder.py's
  # to hold to scripts/ci/legs.py.
  node:
    name: node
    needs: [plan, checks, still-head]
    # A rerun of failed jobs has no watch and no label to run on: nothing to turn on for it.
    if: needs.plan.outputs.attempt == github.run_attempt && needs.plan.outputs.reuse_run_id == ''
    runs-on: ubuntu-24.04
    environment: latitude-builder
    # 85 minutes = latitude_node.PROVISION_DEADLINE_S (4800 s: the capacity wait of 4200 s, which is the longest hold of a node by a full run measured, 66.8 min in run
    # 45499190667, with margin, plus the 600 s reserve) + 5 minutes for the steps of this job around it. A run waiting for a node holds none: only these runner minutes.
    # test_latitude_node.py holds the relation between this number and the constants.
    timeout-minutes: 85
    permissions: { actions: read, contents: read }
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      # The node's apt packages are resolved against the node's OWN image, at its start, and kept per image state and list: a closure fixed once
      # (as if nothing were installed) failed on a provider image newer than it, where libpam-systemd asked for systemd (= 8.18) and 8.19 was
      # installed. `up` reads the node's dpkg database and names the closure; a miss is resolved here, on this runner, and kept; `prepare` sends it.
      # A failure in any step fails the job, and stop-node turns the node off.
      - name: Turn the run's node on and read its package state
        id: up
        env:
          LATITUDE_API_KEY: ${{ secrets.LATITUDE_API_KEY }}
          LATITUDE_PROJECT: ${{ secrets.LATITUDE_PROJECT }}
          # Sites not to take for now (latitude_node.py): a variable of the environment, empty normally.
          LATITUDE_EXCLUDE_SITES: ${{ vars.LATITUDE_EXCLUDE_SITES }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/latitude_node.py up \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --work "$RUNNER_TEMP/build-node"
      - name: The node's closure of packages, from the cache
        id: closure
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-debs
          key: node-debs-${{ steps.up.outputs.key }}
      - name: Resolve the closure against the node's own image
        if: steps.closure.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: bash .series/platform/ci/src/scripts/ci/node_deps_resolve.sh "$RUNNER_TEMP/build-node/dpkg-status" "$RUNNER_TEMP/node-debs"
      - name: Keep the closure
        if: steps.closure.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-debs
          key: node-debs-${{ steps.up.outputs.key }}
      - name: Prepare the node, start one runner per leg
        env:
          LATITUDE_API_KEY: ${{ secrets.LATITUDE_API_KEY }}
          LATITUDE_PROJECT: ${{ secrets.LATITUDE_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/latitude_node.py prepare \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --work "$RUNNER_TEMP/build-node" \
            --debs "$RUNNER_TEMP/node-debs" --upstream .series/UPSTREAM.json

  # The Python packages of the build job, from the index ONCE per runner image, Python and lock (py-deps.yml, ci-03), never by the leg: the node reads no index.
  # Ubuntu 24.04, Python 3.11 (the node's CPython 3.11, scripts/ci/node_bootstrap.sh): the node IS Ubuntu 24.04 like the hosted image, and a wheel is chosen
  # by the Python's minor, the CPU and the glibc floor, not by the image's build, so what the resolver's pip downloads there installs on the node, and the
  # leg proves it before the build (`pip install --dry-run`, below). They start with the node and are skipped as it is (a rerun, a reused build).
  #   core:     the core at core_ref (the page-surface gate's branding) with the dependencies and the dev set of the lock core-checks
  #   mach:     what ./mach build installs from the index (python/sites/mach.txt and build.txt), and the vendored fallback pyyaml
  #   lavapipe: Mesa's build tools (scripts/ci/lavapipe/VERSIONS.json "pip")
  py-deps-build-core:
    needs: [plan, checks, still-head]
    if: needs.plan.outputs.attempt == github.run_attempt && needs.plan.outputs.reuse_run_id == ''
    uses: ./.github/workflows/py-deps.yml
    permissions: { contents: read }
    with:
      name: build-core
      python: "3.11"
      lock: scripts/ci/locks/core-checks.txt
      core_ref: ${{ needs.plan.outputs.core_ref }}
  py-deps-build-mach:
    needs: [plan, checks, still-head]
    if: needs.plan.outputs.attempt == github.run_attempt && needs.plan.outputs.reuse_run_id == ''
    uses: ./.github/workflows/py-deps.yml
    permissions: { contents: read }
    with:
      name: build-mach
      python: "3.11"
      lock: scripts/ci/locks/mach.txt
  py-deps-build-lavapipe:
    needs: [plan, checks, still-head]
    if: needs.plan.outputs.attempt == github.run_attempt && needs.plan.outputs.reuse_run_id == ''
    uses: ./.github/workflows/py-deps.yml
    permissions: { contents: read }
    with:
      name: build-lavapipe
      python: "3.11"
      lock: scripts/ci/locks/lavapipe.txt

  build:
    name: build-${{ matrix.leg }}
    needs: [plan, node, py-deps-build-core, py-deps-build-mach, py-deps-build-lavapipe]
    # The label of this run and attempt, one per leg. A leg names no runner
    # (scripts/ci/legs.py), so there is nothing else for it to run on. A rerun of failed
    # jobs reuses the plan's outputs, with the nodes deleted: empty, and GitHub drops the
    # whole matrix, the legs that were green too. `rerun-refused` says so. A leg that failed is run again with a
    # full re-run, which turns new nodes on.
    runs-on: ${{ matrix.runner || (needs.plan.outputs.attempt == github.run_attempt && format('{0}-{1}', needs.plan.outputs.node_label, matrix.leg)) || '' }}
    timeout-minutes: 350
    # What the job's token may do, on a node a stranger owns: read this repository.
    permissions: { contents: read }
    env:
      MOZ_BUILD_DATE: ${{ needs.plan.outputs.build_date }}
      # Every event scripts/ci/phase.py records is this leg's.
      CI_LEG: ${{ matrix.leg }}
      # Every inherited CARGO_* variable enters sccache's key for Rust, and no runner's
      # image sets this one: stated here, so the key is the same on every leg.
      CARGO_HOME: /home/runner/.cargo
    strategy:
      fail-fast: false
      # The legs are data in scripts/ci/legs.py (runner, host, target, asset
      # name), computed once by the plan job: the asset names used to be
      # written here by hand, one per entry, with the version in each.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # The node's CPython is installed by scripts/ci/node_bootstrap.sh (CPYTHON there: version, release and sha256 of the tarball actions/python-versions
      # publishes) into the tool cache, and setup-python finds it there and downloads nothing. setup-python has no switch that says "never download":
      # a version missing from the cache it would fetch from the net, and run `pip install pip` after it (both unpinned). So the exact version is asked for, and a node
      # without it stops HERE, by name, before setup-python could reach for it (scripts/ci/test_release_builder.py holds these versions to the bootstrap's).
      - name: The node's CPython 3.12.16 is in the tool cache, never downloaded
        shell: bash
        run: |
          PY="${RUNNER_TOOL_CACHE:?}/Python/3.12.16"
          if [ ! -f "$PY/x64.complete" ] || [ "$("$PY/x64/bin/python" --version 2>&1)" != "Python 3.12.16" ]; then
            echo "ERROR: no CPython 3.12.16 in the node's tool cache ($PY): scripts/ci/node_bootstrap.sh installs it, and the job never downloads one"
            exit 1
          fi
      - name: Python for the series tool
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12.16', check-latest: false }
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        # 497 `git update-index` and 70 `git apply`, each reading and rewriting an index
        # of 400,000 entries. Split, each rewrites only what changed: same objects, same
        # commit, and materialize refuses a tree other than the one UPSTREAM.json declares.
        # The checkout that follows writes its files on every core.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.splitIndex
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: checkout.workers
          GIT_CONFIG_VALUE_1: '0'
        run: |
          MATERIALIZE="python .series/tools/engine.py materialize --into ."
          # On a node the two legs fetch and apply once, in NODE_SHARED (node_runner.sh).
          [ -z "${NODE_SHARED:-}" ] || MATERIALIZE="$MATERIALIZE --shared $NODE_SHARED"
          if [ "${{ matrix.node }}" = "true" ]; then
            python3 .series/platform/ci/src/scripts/ci/background.py start materialize -- $MATERIALIZE
          else
            $MATERIALIZE
          fi
      # What needs no source tree comes down beside it on the node. The toolchains cannot:
      # their key hashes files of the tree.
      - name: Compile cache - restore this leg's last one
        id: cache-restore
        if: needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ matrix.leg }}-
      # Once more when the first restore brought nothing. In run 40647970370
      # the download was cut off two minutes in on linux-arm64 and
      # win-x86_64 ("Failed to restore: The operation was aborted"), the step
      # only warned, and both legs built cold without a word: 0.06% and 1.6%
      # hits, the Windows build 2h39 against 1h50. A leg that has no cache
      # yet misses twice, which costs seconds.
      - name: Compile cache - restore again if the first brought nothing
        id: cache-restore-again
        if: needs.plan.outputs.compile_cache == 'gha' && steps.cache-restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ matrix.leg }}-
      - name: The source tree - materialized
        if: matrix.node
        run: python3 .series/platform/ci/src/scripts/ci/background.py wait materialize

      # Record what this build came from: source-commit.txt is the engine commit (the
      # tag plus the series applied, reproducible with tools/engine.py apply) that the
      # seal names; series-commit.txt is the commit of this repository, the series.
      # The publish job turns previous-release..this series commit into the release
      # notes (scripts/gen_release_notes.py) and re-publishes both files as assets, so
      # the NEXT release knows where to start the changelog. One leg is enough: every
      # leg applies the same series to the same tag.
      - name: Record source commit (for auto release notes)
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        env:
          GTESTS: ${{ needs.plan.outputs.gtests }}
          GTEST_FILTER: ${{ needs.plan.outputs.gtest_filter }}
        run: |
          git rev-parse HEAD > source-commit.txt && cat source-commit.txt
          # Which gtests this run runs, as `mach gtest` takes them (empty: none): a later run reuses these bytes only for gtests this filter contains.
          if [ "$GTESTS" = "true" ]; then printf '%s\n' "$GTEST_FILTER" > gtest-filter.txt; else : > gtest-filter.txt; fi
          cat gtest-filter.txt
          # The tree object is what the build is of: a later run on the same tree reuses these bytes (scripts/ci/reuse_run.py).
          git rev-parse 'HEAD^{tree}' > source-tree.txt && cat source-tree.txt
          git -C .series rev-parse HEAD > series-commit.txt && cat series-commit.txt
      - name: Upload source-commit artifact
        if: matrix.leg == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-commit
          path: |
            source-commit.txt
            source-tree.txt
            gtest-filter.txt
            series-commit.txt
          if-no-files-found: error
          retention-days: 7

      - name: The node's CPython 3.11.18 is in the tool cache, never downloaded
        shell: bash
        run: |
          PY="${RUNNER_TOOL_CACHE:?}/Python/3.11.18"
          if [ ! -f "$PY/x64.complete" ] || [ "$("$PY/x64/bin/python" --version 2>&1)" != "Python 3.11.18" ]; then
            echo "ERROR: no CPython 3.11.18 in the node's tool cache ($PY): scripts/ci/node_bootstrap.sh installs it, and the job never downloads one"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11.18', check-latest: false }

      # The packages of this job, by name, from the three wheelhouses of the py-deps jobs above (py-deps.yml): the node never reads the index. The wheelhouse
      # is proved installable on THIS Python first (`--dry-run`: a wheel its tags do not fit is named here, in the first minutes, not by mach in the build), then
      # pip is told, for every command of the job that follows (mach's own `pip install` into its venvs, which inherits the environment: python/mach/mach/site.py
      # pip_install passes os.environ and no --isolated), to read no index and the mach wheelhouse: an `orjson>=3.10` or a `pyyaml==6.0.3` that mach asks for is
      # the file the lock names and its resolver hashed. uv (mach prefers it when it is on the PATH; the node has none) reads the same two variables under its names.
      - name: The wheelhouse of the run's py-deps-build-core job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-build-core-linux
          path: ${{ runner.temp }}/py-deps-core
      - name: The wheelhouse of the run's py-deps-build-mach job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-build-mach-linux
          path: ${{ runner.temp }}/py-deps-mach
      - name: The wheelhouse of the run's py-deps-build-lavapipe job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-build-lavapipe-linux
          path: ${{ runner.temp }}/py-deps-lavapipe
      - name: Python packages - the wheelhouses install on this Python, and pip reads no index from here on
        shell: bash
        run: |
          for house in core mach lavapipe; do
            python3 -m pip install --quiet --dry-run --no-index --find-links "$RUNNER_TEMP/py-deps-$house" --require-hashes -r "$RUNNER_TEMP/py-deps-$house/lock.txt"
          done
          {
            echo "PIP_NO_INDEX=1"
            echo "PIP_FIND_LINKS=$RUNNER_TEMP/py-deps-mach"
            echo "UV_NO_INDEX=1"
            echo "UV_FIND_LINKS=$RUNNER_TEMP/py-deps-mach"
          } >> "$GITHUB_ENV"

      # The page-surface gate at the packaging step asks the core which
      # branding archive it declares (validate_release.declared_branding): an
      # engine with the branding redirect (P60) serves that archive, not the
      # brand in its omni.ja, so that archive is what a page reads and what is
      # judged. The core is the one the drive gate pairs with the binary,
      # core_ref, so both gates judge the same pairing. An engine without the
      # redirect never asks, and the install stays unconditional on purpose:
      # every engine built from a tree with P60 redirects, so a conditional
      # would only be a second place deciding what serves_declared_branding
      # already decides from the tree, and a core_ref that cannot install
      # fails the drive gate of the same run.
      #
      # BEFORE the build, and the question asked once here: the core's answer
      # does not depend on the build. It used to be installed after `mach
      # build`, so a core whose contract had moved was found at the packaging
      # step, two hours in: every leg of the first firefox-50 candidate died
      # there, because core 49.46.0 refuses a profile translated without a
      # session zone and the gate did not pass one.
      - name: Install the invisible_core the page-surface gate asks for its branding
        run: |
          python3 -m pip install --quiet --no-index --find-links "$RUNNER_TEMP/py-deps-core" --require-hashes -r "$RUNNER_TEMP/py-deps-core/lock.txt"
          python3 -m pip install --quiet --no-index --no-deps --find-links "$RUNNER_TEMP/py-deps-core" invisible_core
          python3 -c "from importlib.metadata import version; print('core asked for the branding:', version('invisible-core'))"
          ( cd scripts && python3 -c "import validate_release; print('branding it declares:', validate_release.declared_branding())" )

      # The toolchains in an entry of their own, by their versions, on the x86_64
      # legs wherever they run: ~/.mozbuild (clang, the MSVC of the win leg, what
      # --enable-bootstrap fetches) and the retail's Rust. The CDNs have stopped us
      # twice (runs 41205185526, 41302586484), and the node starts empty every time.
      - name: Toolchains - their versions
        id: toolchains-key
        if: matrix.node
        shell: bash
        run: |
          RUST="$(python3 scripts/upstream_toolchain.py --leg ${{ matrix.leg }} rust-version)"
          echo "rust=$RUST" >> "$GITHUB_OUTPUT"
          echo "key=toolchains-${{ matrix.leg }}-rust$RUST-${{ hashFiles('taskcluster/kinds/toolchain/*.yml', 'build/vs/*.yaml', 'build/moz.configure/bootstrap.configure') }}" | tee -a "$GITHUB_OUTPUT"
      - name: Toolchains - restore
        id: toolchains
        if: matrix.node
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.mozbuild
            !~/.mozbuild/srcdirs
            ~/.rustup/toolchains/${{ steps.toolchains-key.outputs.rust }}-x86_64-unknown-linux-gnu
          key: ${{ steps.toolchains-key.outputs.key }}

      # The retail's Rust, not the runner's. --enable-bootstrap fetches clang
      # from Mozilla but takes Rust from PATH, and the runner's "stable" built
      # the 157 candidates with rustc 1.99.0 against the retail's 1.95.0 - and
      # would have moved by itself next month. The release is the one the
      # retail build of upstream_source.txt's changeset fetched
      # (scripts/upstream_toolchain.py), so a new Firefox brings its own.
      # scripts/toolchain_parity.py compares the result after the build.
      - name: Rust, the retail's release for this tree
        run: |
          RUST="$(python3 scripts/upstream_toolchain.py --leg ${{ matrix.leg }} rust-version)"
          rustup toolchain install "$RUST" --profile minimal --target ${{ matrix.rust_target }}
          rustup default "$RUST"
          rustc --version

      # THE COMPILE CACHE (compile_cache=gha, decided by
      # scripts/release_plan.py). The run after a fix must recompile
      # only what the fix touches: a port to a new version of
      # Firefox takes many runs, and each one cold costs 1-2 hours per leg.
      #
      # HOW: sccache with the cache on the runner's DISK (SCCACHE_DIR), and that
      # folder saved and restored by actions/cache as ONE entry per leg.
      #
      # NOT sccache's `gha` backend (SCCACHE_GHA_ENABLED), which is how
      # this cache was born on 2026-10-26 and was measured wrong: it creates
      # a cache entry FOR EVERY compiled object, about 5,500 per leg, and
      # GitHub accepts 200 new entries per minute per repository (1,500 reads);
      # beyond that, the upload fails and sccache goes on silently. Result:
      # 33-48% of the writes lost in the cold run and 100% in a warm run
      # on Windows (runs 40302089863, 40318828530), and what is not
      # written is a miss again in the next run. One entry per leg per run is
      # very far from that ceiling.
      #
      # AND A SINGLE sccache, the one pinned here, passed to configure with the
      # ABSOLUTE path. With `--with-ccache=sccache` (the bare name in the
      # .mozconfig) and --enable-bootstrap, mach downloads an sccache of ITS OWN in
      # ~/.mozbuild/sccache and configure takes that one: in the same runs the
      # x86_64 and Windows legs compiled with Mozilla's 0.17.0, the arm64 one
      # (where bootstrap provides none) with the 0.18.0 pinned here. The
      # step after the build fails if the compiler did not go through this one.
      #
      # The key is per leg and unique per run (cache entries are
      # immutable); it restarts from the last one of the same leg. The sccache keys
      # inside the folder are the hash of the preprocessed source,
      # arguments and compiler, so a reused object is identical to the one
      # that compiling would produce. The repository's ceiling is 150 GB since
      # 2026-10-28 (10 until the 27th, then 60). With PGO + LTO + symbols a build
      # writes MORE than 15 GB of objects: sccache evicts the oldest to
      # stay within the ceiling, the next build compiles in the same order, finds
      # the first ones evicted and by writing them evicts the ones it would need
      # later - run 40557157874 reused 0.2% (before PGO 98.5%).
      # 30 GB per leg, 90 in all: they fit, with the previous generation
      # of each leg, which is the least recently used and goes first.
      #
      # Pinned versions, not "latest": a build that changes tool by itself
      # between one run and the next is not reproducible.
      #
      # Built from its tag and our patches (scripts/ci/sccache_build.py), never
      # downloaded: 0.18.0 counts the file of a Rust -C profile-use among the
      # compile's outputs and wrote the PGO profile back on every cache hit, and
      # the new mtime made the symbols step rebuild gkrust and relink xul (run
      # 40630019710). The binary is cached by tag and patches.
      - name: Compile cache - the sccache binary, if built before
        if: needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-bin
          # The node's binary has an entry of its own, even on the same Ubuntu as GitHub's runners. Compile hits do not depend on it: neither sccache's version nor
          # its path enters their key.
          key: sccache-bin-${{ runner.os }}-${{ runner.arch }}${{ runner.environment != 'github-hosted' && '-node' || '' }}-v0.18.0-${{ hashFiles('scripts/ci/sccache/*.patch', 'scripts/ci/sccache_build.py') }}
      - name: Compile cache - build the one sccache this build uses
        if: needs.plan.outputs.compile_cache == 'gha'
        shell: bash
        run: |
          SCCACHE_PATH="$(python3 scripts/ci sccache-build --tag v0.18.0 --patches scripts/ci/sccache --out "$HOME/.cache/sccache-bin")"
          "$SCCACHE_PATH" --version
          echo "SCCACHE_PATH=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - name: Compile cache - sccache keeps it on the runner's disk
        if: needs.plan.outputs.compile_cache == 'gha'
        run: |
          {
            echo "SCCACHE_DIR=$HOME/.cache/sccache-ci"
            echo "SCCACHE_CACHE_SIZE=30G"
            echo "SCCACHE_PINNED_VERSION=0.18.0"
            # Never idle out: the full-LTO link runs for longer than the default
            # ten minutes with nothing to compile, the server exited, and the
            # statistics step read a fresh server's zeros (run 40593659072).
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"
      # What this build starts from, said where it is read: a cold candidate is
      # a fact of the run, not something to infer from its length.
      - name: Compile cache - what this build starts from
        if: needs.plan.outputs.compile_cache == 'gha'
        shell: bash
        env:
          FIRST: ${{ steps.cache-restore.outputs.cache-matched-key }}
          AGAIN: ${{ steps.cache-restore-again.outputs.cache-matched-key }}
        run: |
          FROM="${FIRST:-$AGAIN}"
          # What this build adds is measured against this (scripts/ci/cache_rules.py).
          python3 scripts/ci/cache_rules.py snapshot --dir ~/.cache/sccache-ci --out "$RUNNER_TEMP/sccache-restored.json"
          if [ -n "$FROM" ]; then
            echo "compile cache: ${{ matrix.leg }} restored $FROM; whether it was any use is said after the build, from its hits" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::compile cache: ${{ matrix.leg }} restored nothing and builds cold"
            echo "compile cache: ${{ matrix.leg }} restored NOTHING, this build is cold" >> "$GITHUB_STEP_SUMMARY"
          fi
      # For the node's first runs: which objects miss on every run, by name (about 55 on
      # Linux). The server alone: every client logs to stderr under SCCACHE_LOG, and that
      # would go into the build's log and into what configure's compiler checks read. Only
      # the server has SCCACHE_ERROR_LOG, out of the tree; only the names leave the node.
      - name: Compile cache - the node's server, which alone logs
        if: needs.plan.outputs.compile_cache == 'gha' && matrix.node
        run: SCCACHE_LOG=debug SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-debug.log" "$SCCACHE_PATH" --start-server

      # The .mozconfig in layers (scripts/ci/mozconfig.py): compile cache,
      # symbols, the retail's PGO and LTO, platform, machine. Each layer writes
      # its reason into the file, and the flags are fixed by scripts/ci/test_ci.py.
      - name: The node - compile jobs from its limits
        if: runner.environment != 'github-hosted'
        run: |
          PARALLEL="$(python3 scripts/ci node-parallel)"
          [ "$PARALLEL" -ge 1 ] || { echo "ERROR: no compile jobs from the node's limits: '$PARALLEL'"; exit 1; }
          echo "CI_PARALLEL=$PARALLEL" | tee -a "$GITHUB_ENV"
      # The link of a full-LTO libxul is one thread for 29 minutes on 24 GB. Huge pages for
      # that heap, on the Linux node's links only: `mach build` runs them through this linker.
      # Not on Windows: there the only way to the linker is LINKER, a configure option, which
      # about:buildconfig would print (see the Build step).
      - name: The node - its linker asks for huge pages
        if: matrix.node && matrix.family == 'linux'
        run: python3 scripts/ci linker-shim --out "$HOME/.cache/ci-linker" | tee -a "$GITHUB_ENV"
      - name: The CI's .mozconfig, in layers
        env:
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
        run: |
          rm -f mozconfig
          if [ "$COMPILE_CACHE" = "gha" ]; then
            test -x "$SCCACHE_PATH" || { echo "ERROR: no sccache at SCCACHE_PATH=$SCCACHE_PATH"; exit 1; }
          fi
          python3 scripts/ci mozconfig --leg "$CI_LEG" --compile-cache "$COMPILE_CACHE"

      # The objects of every directory the series touches, BEFORE the build of the browser: compile only (`target-objects`, no archive, no link), in the
      # same objdir with the same flags, so the build that follows finds them made and the compile cache sees nothing different. The directories are the
      # ones of the files that differ from the Mozilla tag (ours and Mozilla's that the series changes, the gtests of ours included): scripts/ci/objects_first.py
      # makes the list from the tree, runs the export tier first (the generated headers a directory needs to compile alone), then every directory, and when one
      # fails each on its own, so ALL the errors of ALL the directories come out of one run, listed by file in the summary. A file that does not compile
      # stops the run here, minutes in, and not after the link of the browser (twenty minutes in on the faster leg, an hour on the slower).
      # It first runs the pre-export and export tiers (dist/include and the generated headers: `export` alone left dist/include empty, run 44942834683).
      # The step this replaces passed `mach build --keep-going <dir>` for each directory, and mach IGNORES a subdirectory without --allow-subdirectory-build
      # ("was ignored", candidate 43203723323): it compiled nothing.
      - name: Our objects first - every directory the series touches, compile only
        id: objects
        if: runner.environment != 'github-hosted'
        timeout-minutes: 60
        # A whole candidate never loses a leg to this step: it reports in the summary and the real build runs next (its errors would be the same).
        # Only the compile-only run (stop_after=objects) fails on an error, which is all it is for. continue-on-error covers a crash of the step itself.
        # continue-on-error: a compile step, not a test (it lists compile errors in the summary; the build after it reports the same errors)
        continue-on-error: ${{ needs.plan.outputs.stop_after != 'objects' }}
        shell: bash
        env:
          STRICT: ${{ needs.plan.outputs.stop_after == 'objects' && '--strict' || '' }}
        run: python3 scripts/ci objects --upstream .series/UPSTREAM.json $STRICT

      - name: Build
        id: build
        # Not on a compile-only run (stop_after=objects): it stops after the step above.
        if: needs.plan.outputs.stop_after != 'objects'
        env:
          # Windows's link cannot be reached alone, so its whole build asks for huge pages.
          # No configure option reads this (scripts/ci/test_release_path.py).
          GLIBC_TUNABLES: ${{ matrix.node && matrix.family == 'win' && 'glibc.malloc.hugetlb=1' || '' }}
          # Which objects miss, by name: sccache compiles in its clients here (configure's
          # SCCACHE_CLIENT_SIDE without MOZ_AUTOMATION), so the server's debug log never saw a
          # compile and sccache-misses.txt came out empty on every run. The one module that
          # says hit or miss, into this step's log; nothing else of sccache's debug.
          SCCACHE_LOG: ${{ matrix.node && 'sccache::compiler::compiler=debug' || '' }}
        # A ceiling on the STEP, not only on the job. On 2026-08-26 the
        # win-x86_64 leg hung on the download of the Microsoft toolchain that
        # `--enable-bootstrap` does at the start of the build: no line emitted for over
        # three hours, with mach's counter stuck at 0:29. Without this ceiling the
        # run would have used up the job's 6 hours before giving up, and the
        # fault is recognised only by opening the log and noticing that the counter
        # does not move - that is, by hand.
        # 180 minutes are 48% above the slowest successful build ever
        # observed on this leg (121 min on 2026-08-26; 105 and 106 on
        # 2026-08-17), so it does not kill a slow but real build. When it fires,
        # the job is FAILED instead of hung. The whole run is relaunched, which
        # turns on a new node: `rerun-failed-jobs` cannot (see `rerun-refused`).
        #
        # --keep-going: a run that fails reports ALL the compilation errors of
        # the leg, not only the first ones. Without it, make stops at the
        # first and every 1-2 hour run shows one or two, which is the slowest
        # way to bring the stack to a new version. On a build that
        # succeeds nothing changes.
        # The disk too: the Windows leg of run 40466778026 stopped logging after
        # 86 of its 175 minutes with memory at 3 of 16 GB, and the runner never
        # answered again - the pattern of a full disk, which the next run will
        # show or rule out.
        # 300 since PGO + full LTO (2026-10-27): the first Windows leg with
        # them compiled for 156 minutes before its link, cold; the job's own
        # limit (350) stays above it.
        timeout-minutes: 300
        # Memory, swap and disk (memory_watch.py): a leg that runs out of memory goes
        # silent and is terminated without a word (run 40437686466), and these
        # lines are what tells that apart from a hang. The whole output also
        # goes to logs/build.log, uploaded when the build fails: the Windows leg of
        # run 40446702889 failed after its log stream had stopped, and no
        # line of the failure was left to read.
        run: |
          # Sampling every two minutes missed the burst that froze the Windows
          # legs of runs 40446702889 and 40466778026 (3 of 16 GB in the last
          # sample, then nothing): memory_watch.py samples every 5 seconds,
          # names the largest processes when memory runs low, and kills the
          # largest non-runner process before the machine freezes.
          # The phase records its events and, failing, puts its first error
          # lines and the watch's kills in the step summary (scripts/ci/phase.py);
          # its whole output goes to logs/build.log.
          python3 -u scripts/memory_watch.py --log memwatch.log &
          # The libxul link on one group of cores (scripts/ci/link_pin.py), the two legs on
          # the two groups, and the machine's topology and frequency policy in its log. The
          # large L3 to the Windows leg, which usually ends last: on it a link took 13.8 min,
          # on the small one 14.8, both on the node at once (run 41819266470).
          if [ "${{ matrix.node }}" = "true" ]; then
            python3 -u scripts/ci/link_pin.py --mode "${{ matrix.leg == 'win-x86_64' && 'large-l3' || 'small-l3' }}" --log linkpin.log &
          fi
          # The PGO profile is an input and nothing may move it (scripts/ci/input_watch.py):
          # run 40619608072 found its mtime 18 minutes into this step, and cargo
          # rebuilt gkrust for it in the symbols step.
          PROFILE="$HOME/pgo/merged.profdata"
          if [ -f "$PROFILE" ]; then python3 scripts/ci input-watch --file "$PROFILE" --log inputwatch.log & fi
          # On the node the link goes on while the steps below use the machine: this step
          # ends with the compiles, the next ones save, `Build - the link` takes the result.
          if [ "${{ matrix.node }}" = "true" ]; then
            python3 scripts/ci/background.py start build -- python3 scripts/ci phase build -- ./mach build --keep-going
            python3 scripts/ci/background.py until-compiled build
            # The link of the gtests' libxul (one thread, full LTO, 20 min on Windows) is independent of the browser's
            # (one thread, 12 min): beside it, not after the package. Measured on 43176569993: 12.3 + 19.7 min in a row on a
            # node of 24 cores that was 88% idle. The two meet in `Build - the link`; the package waits for both.
            if [ "${{ needs.plan.outputs.gtests }}" = "true" ]; then
              python3 scripts/ci/background.py start gtest -- python3 scripts/ci phase gtest -- ./mach build --keep-going recurse_gtest
            fi
          else
            python3 scripts/ci phase build -- ./mach build --keep-going
            if [ -f "$PROFILE" ]; then python3 scripts/ci input-watch --file "$PROFILE" --log inputwatch.log --verify --strict; fi
          fi
      # WebGPU's Vulkan driver on Linux is ours (scripts/ci/lavapipe_build.py):
      # without one requestAdapter() answered null, and with the host's Mesa its
      # version decided limits and raster bytes. Built from pinned sources and
      # our patches with this build's clang and sysroot, into dist/bin before
      # the gtests and the package; it is kept by its inputs, unless the run asks
      # for a cold build. Linux only: Windows has its own WARP.
      # It needs nothing of the build but its clang and sysroot, so it starts when the
      # compiles are over and libxul links: on the 47 cores the link does not use, at nice
      # 19 so the link wins, 24 GB of link and 9.5 of it. Beside the compile it would add
      # to 33.6 GB, and hold the save back. A build that stops before that is red anyway.
      - name: WebGPU's Vulkan driver (linux-x86_64) - its inputs
        id: lavapipe-key
        if: matrix.leg == 'linux-x86_64' && steps.build.outputs.compiled == 'true'
        run: echo "key=lavapipe-${{ matrix.leg }}-$(python3 scripts/ci/lavapipe_build.py --key)" >> "$GITHUB_OUTPUT"
      - name: WebGPU's Vulkan driver (linux-x86_64) - built before
        id: lavapipe-cache
        if: matrix.leg == 'linux-x86_64' && steps.build.outputs.compiled == 'true' && needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lavapipe
          key: ${{ steps.lavapipe-key.outputs.key }}
      - name: WebGPU's Vulkan driver (linux-x86_64) - build
        if: matrix.leg == 'linux-x86_64' && steps.build.outputs.compiled == 'true'
        run: |
          python3 scripts/ci/background.py start lavapipe --nice 19 -- \
            python3 scripts/ci phase lavapipe -- python3 scripts/ci/lavapipe_build.py --out "$HOME/.cache/lavapipe" --pip-house "$RUNNER_TEMP/py-deps-lavapipe" --jobs "${CI_PARALLEL:-4}"
      # On every leg: the newest entry is the one the next run restores, and the node
      # uploads at about 5 MB/s. A build that added little leaves the last entry as it is
      # (scripts/ci/cache_rules.py).
      - name: Compile cache - is this leg's upload worth it
        id: cache-worth
        if: "!cancelled() && needs.plan.outputs.compile_cache == 'gha'"
        # continue-on-error: a cache decision, not a test (without its answer the cache is saved, as before it existed)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          "$SCCACHE_PATH" --show-stats > sccache-stats-now.txt || true
          python3 scripts/ci/cache_rules.py worth --stats sccache-stats-now.txt \
            --dir ~/.cache/sccache-ci --restored "$RUNNER_TEMP/sccache-restored.json" | tee -a "$GITHUB_OUTPUT"
      # Before the link's end on the node: the objects are complete and whole (sccache writes
      # a temporary file and renames it), the upload has 47 idle cores beside it, and a link
      # that fails or a machine lost later no longer costs them.
      - name: Compile cache - save this leg's
        # continue-on-error: a cache upload, not a test (a failed save costs a cold compile next time, never a verdict)
        continue-on-error: true
        # 5 GB at half the measured 5 MB/s. A stalled upload must not hold a finished link.
        timeout-minutes: 35
        # Also when the build failed: the runs that fix a port fail by design,
        # and they are the ones the cache is for.
        # Never when the build did not start: run 40519477694, cancelled during
        # checkout, saved an empty arm64 entry, and the next run would have
        # restored that one - the newest of its leg - and compiled cold.
        # Never on a cancel: GitHub cuts this job 5:00 after it, always() steps included,
        # and the node's upload takes 15. Not starting frees the node at once; an upload
        # that is cut is never committed, and its key holds this run and attempt.
        # The objects step compiled with the build's flags: what it made is worth keeping when the build after it never ran (it failed, or
        # stop_after=objects). Skipped, it did not start, and nothing is saved, as before.
        if: "!cancelled() && needs.plan.outputs.compile_cache == 'gha' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure' || steps.objects.outcome == 'success' || steps.objects.outcome == 'failure') && steps.cache-worth.outputs.save != 'false'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only after they have compiled the whole build: a download cut off half way must not
      # become the entry every later run starts from.
      - name: Toolchains - save
        # continue-on-error: a cache upload, not a test (a failed save costs a download next time, never a verdict)
        continue-on-error: true
        timeout-minutes: 30
        if: "!cancelled() && matrix.node && steps.build.outputs.compiled == 'true' && steps.toolchains.outputs.cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.mozbuild
            !~/.mozbuild/srcdirs
            ~/.rustup/toolchains/${{ steps.toolchains-key.outputs.rust }}-x86_64-unknown-linux-gnu
          key: ${{ steps.toolchains-key.outputs.key }}

      - name: Build - the link
        id: build-end
        if: "!cancelled() && matrix.node && steps.build.outcome == 'success'"
        timeout-minutes: 300
        run: |
          python3 scripts/ci/background.py wait build
          PROFILE="$HOME/pgo/merged.profdata"
          if [ -f "$PROFILE" ]; then python3 scripts/ci input-watch --file "$PROFILE" --log inputwatch.log --verify --strict; fi
          # The gtests' build was started beside the link (the Build step): its errors (--keep-going shows every one) fail the leg here.
          if [ "${{ needs.plan.outputs.gtests }}" = "true" ]; then python3 scripts/ci/background.py wait gtest; fi
      # Nothing of a leg outlives its job: the node is deleted as soon as the job ends. The
      # runner's signals reach a step's shell and no further, so this is what stops a build
      # on a cancel, about 41 s after it and well inside the 5:00 cut.
      - name: The node - a cancel or a failure ends what runs beside the steps
        if: (cancelled() || failure()) && matrix.node
        timeout-minutes: 2
        run: python3 scripts/ci/background.py stop build lavapipe gtest
      # What enters the compile's key and can move by itself: two runs that miss for no
      # reason differ here (scripts/ci/cache_rules.py).
      - name: Compile cache - what its key depends on
        if: always() && steps.build.outcome != 'skipped'
        run: python3 scripts/ci/cache_rules.py guard | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the logs of a failed build
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildlog-${{ matrix.leg }}
          path: |
            logs/
            memwatch.log
          if-no-files-found: ignore
          retention-days: 14

      # The compile cache's own gate: the build compiled through the sccache
      # pinned above, nothing else, and every object it compiled was stored.
      # Statistics first, so a refusal still shows them; then the server stops.
      - name: Compile cache - the build used the pinned sccache
        if: always() && needs.plan.outputs.compile_cache == 'gha'
        run: |
          "$SCCACHE_PATH" --show-stats | tee sccache-stats.txt || true
          STATS="$(cat sccache-stats.txt)"
          "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
          # configure.py writes the substs as JSON beside config.status.
          CONFIGURED="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["substs"].get("CCACHE", ""))' obj-rel/config.status.json 2>/dev/null || true)"
          echo "configure took CCACHE=${CONFIGURED:-<none>}"
          if [ "$CONFIGURED" != "$SCCACHE_PATH" ]; then
            echo "ERROR: configure did not take SCCACHE_PATH=$SCCACHE_PATH"
            exit 1
          fi
          SERVER="$(echo "$STATS" | sed -n 's/^Version (client) *//p')"
          if [ -n "$SERVER" ] && [ "$SERVER" != "$SCCACHE_PINNED_VERSION" ]; then
            echo "ERROR: the sccache server that compiled is $SERVER, pinned is $SCCACHE_PINNED_VERSION"
            exit 1
          fi
          WRITE_ERRORS="$(echo "$STATS" | sed -n 's/^Cache write errors *//p')"
          if [ "${WRITE_ERRORS:-0}" != "0" ]; then
            echo "::warning::sccache failed to store $WRITE_ERRORS objects: the next run recompiles them"
          fi
      - name: Compile cache - cold or warm, from its hits
        if: always() && needs.plan.outputs.compile_cache == 'gha' && steps.build.outcome != 'skipped'
        run: python3 scripts/ci/cache_rules.py heat --leg "$CI_LEG" --stats sccache-stats.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile cache - which objects missed, by name
        if: always() && matrix.node && needs.plan.outputs.compile_cache == 'gha'
        run: |
          grep -hF 'Cache miss in' "$RUNNER_TEMP/sccache-debug.log" logs/build.log > sccache-misses.txt 2>/dev/null || true
          echo "compile cache: $(wc -l < sccache-misses.txt) objects missed, by name in this leg's events artifact" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: WebGPU's Vulkan driver (linux-x86_64) - done
        id: lavapipe
        if: matrix.leg == 'linux-x86_64' && needs.plan.outputs.stop_after != 'objects'
        # LLVM and Mesa cold: about an hour; a cache hit is seconds. It began long ago.
        timeout-minutes: 150
        run: |
          python3 scripts/ci/background.py wait lavapipe
          mkdir -p obj-rel/dist/bin/lavapipe
          cp "$HOME/.cache/lavapipe/libvulkan_lvp.so" "$HOME/.cache/lavapipe/VERSION.json" obj-rel/dist/bin/lavapipe/
          # WebGL's GL, built from the same tree (llvmpipe behind EGL, gfx/gl/StealthOwnGL.h).
          mkdir -p obj-rel/dist/bin/llvmpipe
          cp "$HOME/.cache/lavapipe/gl/"* obj-rel/dist/bin/llvmpipe/
          cat obj-rel/dist/bin/lavapipe/VERSION.json
      - name: WebGPU's Vulkan driver (linux-x86_64) - keep it
        if: matrix.leg == 'linux-x86_64' && needs.plan.outputs.compile_cache == 'gha' && steps.lavapipe.outcome == 'success' && steps.lavapipe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lavapipe
          key: ${{ steps.lavapipe-key.outputs.key }}

      # Packaging per family (scripts/ci/package_linux.sh, package_win.sh):
      # the same gates, the archive layout each platform ships.
      - name: Package + validate
        if: needs.plan.outputs.stop_after != 'objects'
        env:
          ASSET: ${{ matrix.asset }}
          # `mach package` compresses a tar.xz nothing reads: the leg ships its own tar.gz
          # of dist/firefox. With PGO its command line says -9e, 192 MiB blocks: too few for
          # threads to matter. xz reads this, and counts 12.3 GiB for it, with the build over.
          XZ_OPT: ${{ matrix.node && '-T16 --block-size=32MiB --memlimit-compress=16GiB' || '' }}
          # '1' runs mach package after stage_package.sh and compares dist/firefox byte for byte.
          # Proved on 04/11: Linux 166 entries (candidate 41913592515), Windows 191 (41917575322).
          CI_PACKAGE_PROVE: ''
        run: python3 scripts/ci phase package -- bash scripts/ci/package_${{ matrix.family }}.sh

      - name: Upload build artifact
        if: needs.plan.outputs.stop_after != 'objects'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

      # What this build was compiled with, complete: every configure value
      # (compilers, CFLAGS/CXXFLAGS/LDFLAGS, optimisation, LTO, PGO, Rust flags)
      # and every define, as configure wrote them. Until 2026-10-27 the objdir
      # was thrown away with the runner and the answer to "which flags does the
      # engine ship with" had to be pieced together from the mozconfig.
      - name: Build configuration
        if: needs.plan.outputs.stop_after != 'objects'
        run: |
          set -e
          mkdir -p buildconfig
          python3 - obj-rel/config.status.json buildconfig/build-config-${{ matrix.leg }}.json <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          out = {"substs": status.get("substs", {}), "defines": status.get("defines", {})}
          json.dump(out, open(sys.argv[2], "w"), indent=1, sort_keys=True)
          for key in sorted(out["substs"]):
              if any(t in key for t in ("FLAGS", "OPTIM", "LTO", "PGO", "RUST", "CC_VERSION", "CXX_VERSION")) or key in ("CC", "CXX", "LINKER_KIND"):
                  print("%s = %s" % (key, out["substs"][key]))
          PY
      - name: Upload build configuration
        if: needs.plan.outputs.stop_after != 'objects'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildconfig-${{ matrix.leg }}
          path: buildconfig/*.json
          if-no-files-found: error
          retention-days: 90

      # Crash dumps of this build turn into file:line only with its symbols, and
      # until 2026-10-27 no build had any: a content-process crash at shutdown on
      # the 157 candidates was a list of offsets in xul.dll. The archive is a
      # separate artifact, never part of the asset (gate.yml takes asset-* only; publish.yml publishes
      # the symbols of a release beside the archives, never inside them).
      - name: Crash symbols (never shipped)
        if: needs.plan.outputs.stop_after != 'objects'
        # A ceiling of its own: in run 40593659072 this step recompiled Rust
        # (621 crates, 35 minutes against 2 the run before) and nothing bounded
        # it below the job's 350.
        timeout-minutes: 60
        env:
          # Why cargo finds a crate dirty here, in the log: the build had just
          # compiled it (run 40593659072), so something between the two steps
          # changed its fingerprint.
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          set -e
          python3 scripts/ci phase symbols -- ./mach buildsymbols
          mkdir -p symbols
          mv obj-rel/dist/*.crashreporter-symbols.zip symbols/
          ls -la symbols/
      - name: The crash symbols describe the shipped binaries
        if: needs.plan.outputs.stop_after != 'objects'
        # Run 40593659072 uploaded symbols for a xul.dll it did not ship: its
        # symbols step relinked xul after the package was made, and the archive
        # named 3E2BB500 for a binary that shipped as 030D79D8. Nothing said so;
        # a crash report from that build could never have been read.
        shell: bash
        run: python3 scripts/ci symbols-match --package "out/${{ matrix.asset }}" --symbols symbols/*.zip
      - name: Upload crash symbols
        if: needs.plan.outputs.stop_after != 'objects'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-${{ matrix.leg }}
          path: symbols/*.zip
          if-no-files-found: error
          # ~400 MB a run: a candidate's are checked in the run and not kept. The artifact
          # quota filled on 04/11 (81 GB) and every new run failed at its first upload.
          # A release's are published by publish.yml as release assets (symbols-<os>-<arch>-<BuildID>.zip), which fetches them from this run, even
          # on a republish a few weeks later: 30 days.
          retention-days: ${{ needs.plan.outputs.kind == 'release' && 30 || 2 }}

      # The engine's own tests, on request (input gtests): the stealth hooks each have one (StealthStartupCache, the bundled-font and own-binary rules)
      # and nothing else runs them. They run in the jobs gtest-linux and gtest-cross, on GitHub's runners, from the binaries this job builds (the step below).
      # The node only compiles, on both legs: a hosted job runs what it built.
      - name: The node - its gtest binaries, for a job on GitHub's runners
        if: needs.plan.outputs.gtests == 'true' && runner.environment != 'github-hosted'
        timeout-minutes: 180
        shell: bash
        run: |
          # Built beside the browser's link (the Build step, waited for in `Build - the link`); this run finds everything made, so
          # it is the check that nothing was left to build, and it costs seconds. --keep-going: make goes on after the first error,
          # so one run shows EVERY gtest that does not build, not one per run.
          python3 scripts/ci phase gtest-check -- ./mach build --keep-going recurse_gtest
          # And _tests/gtest, the directory mach runs them from: what they read at run time.
          mkdir -p obj-rel/_tests/gtest
          tar -chf gtest-bin.tar -C obj-rel/dist bin -C ../_tests gtest
      - name: The node - the memory of the two links
        if: always() && matrix.node && needs.plan.outputs.gtests == 'true' && runner.environment != 'github-hosted'
        # continue-on-error: a diagnostic, not a test (it prints the least memory the two links left)
        continue-on-error: true
        shell: bash
        run: |
          # The least memory available in the log of memory_watch (a line a minute), and when: the two links of libxul (the
          # browser's and the gtests') run at the same time since the gtests are built beside the link.
          python3 - <<'PY'
          import re
          best = None
          for line in open("memwatch.log", encoding="utf-8", errors="replace"):
              m = re.match(r"(\d\d:\d\d:\d\d) \[mem\] available (\d+)/(\d+) MB", line)
              if m and (best is None or int(m.group(2)) < best[1]):
                  best = (m.group(1), int(m.group(2)), int(m.group(3)))
          if best:
              print("memory at the two links: the least available was %d of %d MB at %s, so the peak in use was %d MB (%.0f%%)"
                    % (best[1], best[2], best[0], best[2] - best[1], 100.0 * (best[2] - best[1]) / best[2]))
          else:
              print("memory at the two links: memwatch.log has no [mem] line")
          PY
      - name: The node - keep them
        # dist/bin at 5 MB/s is minutes. A stalled upload must not take the job's 350.
        timeout-minutes: 60
        if: needs.plan.outputs.gtests == 'true' && runner.environment != 'github-hosted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtest-bin-${{ matrix.leg }}
          path: gtest-bin.tar
          if-no-files-found: error
          retention-days: 3
      # Whether the build used the CPU well, phase by phase (scripts/cpu_watch.py). At
      # most a warning, so it can never cost a build what it has already done.
      - name: CPU use, by phase
        if: always() && matrix.node
        # continue-on-error: a diagnostic, not a test (a report of the CPU use by phase)
        continue-on-error: true
        run: python3 scripts/ci cpu-report
      # This leg's events for the run's summary (the report job): always, a
      # failed or cancelled leg's most of all.
      - name: Upload this leg's events
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: events-${{ matrix.leg }}
          path: |
            events.jsonl
            memwatch.log
            sccache-stats.txt
            sccache-misses.txt
            cpuwatch.jsonl
            linkpin.log
            inputwatch*
            obj-rel/dist/bin/libxul.so.time-trace
          if-no-files-found: ignore
          retention-days: 14

  # The Windows leg's gtests, run where its binary runs. Its build job compiled them
  # on the node; here they run as the Linux leg's do (scripts/ci/gtest_run.py).
  # The job always runs and its steps ask for gtests=true, because the gate needs it. A
  # skipped job would count against every job below it, at any distance, and whether
  # that reaches the jobs inside gate.yml is not established.
  gtest-cross:
    name: gtest-win-x86_64
    needs: [plan, build]
    runs-on: windows-latest
    # TEMP and TMP on D:\a\_temp (the runner's temp folder): the Firefox profiles land in TEMP and on C: they saturate the disk (queue up to 144,
    # latencies up to 4 s, parent main thread still 40-60 s). On the job, not in a step: `runner.temp` is not readable in a job's `env`.
    env:
      TEMP: 'D:\a\_temp'
      TMP: 'D:\a\_temp'
    timeout-minutes: 45
    steps:
      - name: The series (this repository, this commit)
        if: needs.plan.outputs.gtests == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The leg's dist/bin with its gtest libxul
        if: needs.plan.outputs.gtests == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gtest-bin-win-x86_64
          path: gtest-run
      - name: Engine gtests (gtests=true only)
        if: needs.plan.outputs.gtests == 'true'
        shell: bash
        env:
          GTEST_FILTER_INPUT: ${{ needs.plan.outputs.gtest_filter }}
        run: |
          ( cd gtest-run && tar -xf gtest-bin.tar )
          python .series/platform/ci/src/scripts/ci/gtest_run.py --root gtest-run --reports gtest-reports
      - name: What each suite did
        if: always() && needs.plan.outputs.gtests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtest-reports-win-x86_64
          path: gtest-reports/
          if-no-files-found: ignore
          retention-days: 14

  # THE UBUNTU PACKAGES OF gtest-linux (xvfb with its recommends, gdb), from Ubuntu's archive once per runner image and list (linux-deps.yml), never by the leg.
  # No `needs`: it starts with the run, long before the node's build is done, and its entry is almost always in the cache.
  linux-deps-gtest:
    name: linux-deps-gtest
    uses: ./.github/workflows/linux-deps.yml
    with:
      name: gtest
      packages: xvfb gdb

  # The Linux leg's gtests, as `mach gtest` ran them on the green candidate
  # (scripts/ci/gtest_run.py), and always running for the reason gtest-cross does:
  # the node's machine has a GPU and GitHub's runners, where they are judged, do not.
  # The limit is the old step's, which held the link too: * is unproven, and time here
  # is a runner of GitHub's, not the node.
  gtest-linux:
    name: gtest-linux-x86_64
    needs: [plan, build, linux-deps-gtest]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: The series (this repository, this commit)
        if: needs.plan.outputs.gtests == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      # The runners have no display, and some gtests open windows: xvfb (with xauth, its recommend, for xvfb-run), and gdb for the cores of a suite that dies on a
      # signal. From the run's linux-deps-gtest repository (linux-deps.yml), by name and with --no-download: no mirror is read here.
      - name: The Linux packages (the run's linux-deps-gtest job, no mirror)
        if: needs.plan.outputs.gtests == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.linux-deps-gtest.outputs.artifact }}
          path: /tmp/linux-deps
      - name: A display
        if: needs.plan.outputs.gtests == 'true'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # The run's linux-deps repository and nothing else: apt reads only its sources list and lists folder, the files are already in apt's archives,
          # and the roots are installed by name with --no-download: a package the repository does not hold is named here and red, never fetched.
          read -r OS VER < /tmp/linux-deps/image.txt
          echo "the repository was read on $OS $VER; this runner is $ImageOS $ImageVersion"
          sudo mkdir -p /tmp/linux-deps-apt/lists/partial /tmp/linux-deps-apt/parts
          echo "deb [trusted=yes] file:/tmp/linux-deps ./" | sudo tee /tmp/linux-deps-apt/sources.list >/dev/null
          APT="-o Dir::Etc::SourceList=/tmp/linux-deps-apt/sources.list -o Dir::Etc::SourceParts=/tmp/linux-deps-apt/parts -o Dir::State::Lists=/tmp/linux-deps-apt/lists -o Acquire::Languages=none"
          sudo apt-get $APT update
          sudo cp /tmp/linux-deps/*.deb /var/cache/apt/archives/
          sudo apt-get $APT install -y --no-download --no-install-recommends $(cat /tmp/linux-deps/roots.txt)
      - name: The leg's dist/bin with its gtest libxul
        if: needs.plan.outputs.gtests == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gtest-bin-linux-x86_64
          path: gtest-run
      - name: Engine gtests (gtests=true only)
        if: needs.plan.outputs.gtests == 'true'
        env:
          GTEST_FILTER_INPUT: ${{ needs.plan.outputs.gtest_filter }}
        run: |
          tar -C gtest-run -xf gtest-run/gtest-bin.tar
          # A suite that dies on a signal leaves its core here, and gtest_run.py puts every
          # thread's backtrace in the log and in the reports (candidate 42473169415: -11, no more).
          mkdir -p gtest-cores
          sudo sysctl -q -w kernel.core_pattern="$PWD/gtest-cores/core.%p"
          xvfb-run -a python3 .series/platform/ci/src/scripts/ci/gtest_run.py --root gtest-run --reports gtest-reports --cores gtest-cores
      - name: What each suite did
        if: always() && needs.plan.outputs.gtests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtest-reports-linux-x86_64
          path: gtest-reports/
          if-no-files-found: ignore
          retention-days: 14

  # GitHub drops the build matrix on a rerun of failed jobs, with an error only the run's
  # page shows (`runs-on` above). This job is re-run with it, and says what to do.
  rerun-refused:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.attempt != github.run_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: A failed leg comes back with a full re-run
        env:
          SAID: >-
            A re-run of failed jobs cannot bring a leg back: its node is gone, so the
            build matrix vanished, the green legs too. Re-run ALL jobs, which
            turns a new node on and rebuilds from the cache:
            gh run rerun ${{ github.run_id }}
        run: |
          echo "::error::$SAID"
          echo "**$SAID**" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Follows both legs. It needs `node` only, so it does not wait for the gates, and
  # survives a cancel. It turns each node off as its leg ends. A machine lost mid-build
  # leaves the other leg to finish and save its cache, then re-launches the whole run once.
  # Two jobs in a row, each stopping by itself in time: GitHub ends one of its jobs at 6
  # hours, a leg has nearly that from when its runner takes it, and one that dies leaves the
  # next to go on.
  watch-1:
    needs: [plan, node]
    if: always() && needs.plan.result == 'success' && needs.node.result == 'success' && needs.plan.outputs.attempt == github.run_attempt
    runs-on: ubuntu-24.04
    environment: latitude-builder
    timeout-minutes: 345
    permissions: { actions: write, contents: read }
    outputs:
      verdict: ${{ steps.watch.outputs.verdict }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Watch both legs, turn each node off as its leg ends, re-launch once if a machine is lost
        id: watch
        shell: bash
        env:
          LATITUDE_API_KEY: ${{ secrets.LATITUDE_API_KEY }}
          LATITUDE_PROJECT: ${{ secrets.LATITUDE_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # The same run again if a machine is lost: every input by value.
          KIND: ${{ needs.plan.outputs.kind }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
          CORE_REF: ${{ needs.plan.outputs.core_ref }}
          WRAPPER_REF: ${{ needs.plan.outputs.wrapper_ref }}
          GTESTS: ${{ needs.plan.outputs.gtests }}
          GTEST_FILTER_INPUT: ${{ needs.plan.outputs.gtest_filter }}
          STOP_AFTER: ${{ needs.plan.outputs.stop_after }}
          RELAUNCH_OF: ${{ inputs.relaunch_of || '' }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/latitude_node.py watch --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  watch-2:
    needs: [plan, node, watch-1]
    if: always() && needs.plan.result == 'success' && needs.node.result == 'success' && needs.plan.outputs.attempt == github.run_attempt && !contains(fromJSON('["done","lost","failed"]'), needs.watch-1.outputs.verdict)
    runs-on: ubuntu-24.04
    environment: latitude-builder
    timeout-minutes: 345
    permissions: { actions: write, contents: read }
    outputs:
      verdict: ${{ steps.watch.outputs.verdict }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Watch both legs, turn each node off as its leg ends, re-launch once if a machine is lost
        id: watch
        shell: bash
        env:
          LATITUDE_API_KEY: ${{ secrets.LATITUDE_API_KEY }}
          LATITUDE_PROJECT: ${{ secrets.LATITUDE_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # The same run again if a machine is lost: every input by value.
          KIND: ${{ needs.plan.outputs.kind }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
          CORE_REF: ${{ needs.plan.outputs.core_ref }}
          WRAPPER_REF: ${{ needs.plan.outputs.wrapper_ref }}
          GTESTS: ${{ needs.plan.outputs.gtests }}
          GTEST_FILTER_INPUT: ${{ needs.plan.outputs.gtest_filter }}
          STOP_AFTER: ${{ needs.plan.outputs.stop_after }}
          RELAUNCH_OF: ${{ inputs.relaunch_of || '' }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/latitude_node.py watch --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  # Makes sure both nodes are off once the watch is over, not when the whole run is: the
  # gates and tests on GitHub's runners take longer, and a node is paid by the hour. Each
  # goes whatever happens to the other. When the node job did its work this asks GitHub
  # first: a watch that crashed says nothing about a leg, and a healthy build is not deleted
  # for that. A node it leaves on, the sweeper deletes as soon as its leg has finished.
  stop-node:
    needs: [plan, node, watch-1, watch-2]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    environment: latitude-builder
    timeout-minutes: 15
    permissions: { actions: read, contents: read }
    steps:
      - name: The series (this repository, this commit)
        if: always()
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Turn both nodes off and see them gone
        if: always()
        timeout-minutes: 12
        env:
          LATITUDE_API_KEY: ${{ secrets.LATITUDE_API_KEY }}
          LATITUDE_PROJECT: ${{ secrets.LATITUDE_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ONLY_IF: ${{ needs.node.result == 'success' && '--if-legs-done' || '' }}
        run: python3 .series/platform/ci/src/scripts/ci/latitude_node.py off --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" $ONLY_IF

  # After a save, this ref's older entries of the same leg go: the repository is over
  # its cache quota. Deleting needs actions: write, so never in a job on the node.
  cache-trim:
    needs: [plan, build]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { actions: write, contents: read }
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Delete this ref's older entries of the legs this run saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/cache_rules.py trim \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF"

  # One table for the whole run, on its summary page: leg x phase, result,
  # time, memory peak, compile cache hits (scripts/ci/report.py). Always,
  # so a failed or cancelled run says which leg stopped where, and why.
  report:
    needs: [plan, build]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into .
      - name: The legs' events
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: events-*
          path: events
      - name: The run's summary
        run: python3 scripts/ci report events

  # The gate and the publish are written once, in gate.yml and publish.yml,
  # and republish.yml calls the same two.
  gate:
    # The gate and the gtests are two verdicts, each of its own: the gate starts when the build is done, whatever the gtests
    # say (a gtest red on one platform used to skip the gate, so the run showed one red and hid the other: run 43134774602
    # was the first to run the gate at all). The run is red if either is red; the publish needs both.
    needs: [plan, build]
    # A compile-only run (stop_after=objects) has no binary to judge.
    if: needs.plan.outputs.stop_after != 'objects'
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/gate.yml
    with:
      build_run_id: ${{ github.run_id }}
      seal_tag: ${{ needs.plan.outputs.seal_tag }}
      wrapper_ref: ${{ needs.plan.outputs.wrapper_ref }}
      core_ref: ${{ needs.plan.outputs.core_ref }}

  # The same gate on the archives of the run `plan` found (reuse_run_id): the refs are today's, the bytes are that run's, as republish.yml. It
  # is the only verdict of a run that reused; the gtests of that tree are the gtests of that run (reuse_run.py asked for their artifacts).
  gate-reuse:
    needs: plan
    if: needs.plan.outputs.reuse_run_id != ''
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/gate.yml
    with:
      build_run_id: ${{ needs.plan.outputs.reuse_run_id }}
      seal_tag: ${{ needs.plan.outputs.seal_tag }}
      wrapper_ref: ${{ needs.plan.outputs.wrapper_ref }}
      core_ref: ${{ needs.plan.outputs.core_ref }}

  # THE NAMED HOOK TESTS. Every hook of every folder of the series names its test in HOOKS.json (`test`, the grammar of tools/hooks_list.py), and the
  # candidate ran only the gtests of its filter and the rows of the wrapper's list: a hook whose test nobody ran, or that was renamed away, was green
  # (red team H1a, H1b). hook-tests-judge.yml reads the results of THIS run (the gtest reports of both legs, the junit of the gate's wrapper legs, the junit
  # of Juggler's tests) and is red for every named test that is not in them, is skipped, did not pass, or (a gtest) is not in the filter of the run. It reads
  # artifacts only: seconds. It comes after the gate and the gtests, whatever they said (always(): their red is in the results it reads), and the publish
  # needs it. Its judge is MAIN's, and a main without it fails the job (hook-tests-judge.yml says why).
  # Two calls and not one job with the reuse gate among its needs: the publish needs the judge, and a skipped ancestor (the reuse gate, in every run that
  # builds) skips every job below it, the publish included (actions/runner#2205, held by test_release_path.py). A run that reused has no publish.
  # Both wait for `junit-py` (the job of the branch ci/legs-junit that puts together the python junit of the checks and of package-ab, and is itself after
  # the gate, which holds the xpcshell and cargo merge jobs): the artifacts `junit-py`, `junit-xpcshell` and `junit-cargo` exist when the judge reads them.
  # THIS FILE IS VALID ONLY TOGETHER WITH ci/legs-junit (a `needs` on a job that is not there is refused). `junit-py` is after the reuse gate, so it is the
  # skipped ancestor of the publish in a run that builds: the publish says so itself (always(), and the result of each of its needs), as it must.
  hook-tests-judge:
    needs: [plan, checks, build, gate, gtest-cross, gtest-linux, junit-py]
    # A compile-only run has no binary and no results; a run whose build failed has no gate to read (the run is red for the build).
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.stop_after != 'objects' && needs.build.result == 'success'
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/hook-tests-judge.yml
    with:
      gtests: ${{ needs.plan.outputs.gtests }}
      gtest_filter: ${{ needs.plan.outputs.gtest_filter }}
      reuse_run_id: ''

  # The run that reused a green build (a push to main): its verdicts are the gate-reuse's and the gtests of the run it found.
  hook-tests-judge-reuse:
    needs: [plan, checks, gate-reuse, junit-py]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.reuse_run_id != ''
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/hook-tests-judge.yml
    with:
      gtests: ${{ needs.plan.outputs.gtests }}
      gtest_filter: ${{ needs.plan.outputs.gtest_filter }}
      reuse_run_id: ${{ needs.plan.outputs.reuse_run_id }}

  publish:
    # the verdicts: the gate, the gtests and the named hook tests (a gtest job with gtests=false runs and succeeds, its steps are skipped)
    needs: [plan, build, gate, gtest-cross, gtest-linux, hook-tests-judge]
    # a candidate publishes nothing: skipped, and the run is green. Every need must have succeeded, said here and not left to the implicit success(): the
    # judge is after `junit-py`, which is after the reuse gate (skipped in a run that builds), and a skipped ancestor skips the publish (actions/runner#2205).
    if: >-
      !cancelled() && needs.plan.outputs.kind == 'release' && needs.plan.result == 'success' && needs.build.result == 'success' && needs.gate.result == 'success'
      && needs.gtest-cross.result == 'success' && needs.gtest-linux.result == 'success' && needs.hook-tests-judge.result == 'success'
    permissions: { actions: read, contents: write }
    uses: ./.github/workflows/publish.yml
    with:
      build_run_id: ${{ github.run_id }}
      tag: ${{ needs.plan.outputs.tag }}
      num: ${{ needs.plan.outputs.num }}
      prevtag: ${{ needs.plan.outputs.prevtag }}
      wrapper_ref: ${{ needs.plan.outputs.wrapper_ref }}
