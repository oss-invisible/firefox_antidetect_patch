# ─────────────────────────────────────────────────────────────────────────────
# checks.yml — EVERY check that guards main, once. Called by the two rounds that come before a merge:
#   series.yml   on every pull request and every push to main;
#   release.yml  on every candidate (a push to main, the weekly run, a dispatch from a latitude/* branch), and a release: the build node is
#                turned on only after it is green (job `node` needs `checks`).
# The same code in both: nothing is first run on main (docs/decisions/ci-07 of the series; the test that holds it is
# tools/tests/test_every_check_runs_before_the_merge.py). A check is added HERE and nowhere else: neither series.yml nor release.yml runs one.
#
#   rules             the series' own rules: tools/tests (hence the workflow rule tests) and `engine.py check` (folders, manifests, hook
#                     contract, budgets against main's, workflow copies).
#   churn             port-07 (docs/decisions/port-07-quiet-anchors.md): tools/churn.json is what the series gives now. No tree: the Mozilla tags of the
#                     last eight releases and the base, one commit deep and with only the files the series patches, in a repository of their own (a small cache of this job), each checked against the
#                     commit tools/churn.json records; `churn.py --check`, and the real-series test of tools/tests/test_churn.py.
#   range-diff        series-02 (docs/decisions/series-02-every-folder-states-its-relation-to-mozilla.md): on a port, that is a pull request (or a
#                     candidate) that moves mozilla_tag away from main's, ports/range-diff.txt is the range-diff of main's layers on main's tag against this
#                     series' layers on its tag, regenerated here from the two tags (a partial clone of Mozilla's repository, no tree) and compared byte for
#                     byte; on anything else it decides that, says so in its log and is green.
#   rebuilds          the Mozilla tag + the series = the tree declared in UPSTREAM.json (`engine.py materialize` stops when it is another
#                     tree: this is the CI form of `engine.py verify`, which needs the source repository), the birth points against the ledger, and
#                     the core's checks that read the engine's source.
#   noreply-identity  every commit, tag and tagger this event makes public carries a GitHub noreply address.
#   tree              what does not depend on the binary, on the materialized tree: the plan's own tests, the release scripts' known-bad inputs,
#                     asset names, the declared upstream source, our sources and build files, Juggler's tests without a browser, the wrapper's
#                     list of required suites against gate.yml, and the junit of the python and node tests for the hook tests judge.
# `rebuilds` and `tree` each materialize the tree (about 7 to 10 minutes of a GitHub runner, no later start: they run in parallel).
# `churn` is a job of its own, parallel to them, and not a step of `rebuilds`: it needs no materialized tree (nine one-commit-deep tags are not the
# tree the series is applied to), and a step there would wait behind the 7 to 10 minutes of `rebuilds`.
# THE PYTHON PACKAGES of these jobs are not read from the index by them (ci-03): the jobs `py-deps-tools` and `py-deps-core` (py-deps.yml) resolve a lock
# once per runner image, Python and lock and keep the wheelhouse in a cache entry; `rules`, `rebuilds` and `tree` download it and install from it,
# offline, by name (--no-index --find-links --require-hashes). The core `rebuilds` checks is resolved once, by `core-ref`, and handed to both the wheelhouse
# and the checkout: the same commit in both.
# What is NOT here: still_head.py (the guard that cancels a candidate a newer push replaced: it needs `actions: write`, a job the node waits
# for, and means nothing for a pull request: release.yml, job `still-head`).
# ─────────────────────────────────────────────────────────────────────────────
name: checks
on:
  workflow_call:
    inputs:
      wrapper_ref:
        description: >
          invisible_playwright ref whose pin names the core under the core's checks, and whose list of required suites gate.yml must have legs for.
          main for the series' rounds; the run's own wrapper_ref for a candidate.
        type: string
        default: main
      core_ref:
        description: >
          The core ref the run tests: release.yml hands over the core its plan resolved (a candidate's core_ref input, or the pin of the wrapper), so that `core-ref` below
          answers the run's own core and not the wrapper's pin, which a candidate of a new core may not have a tag for yet. Empty (series.yml's rounds): the core the
          wrapper pins.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The wheelhouse of the series' own tools (pytest, pyyaml, fonttools: scripts/ci/locks/tools.txt) for `rules` and `tree`, Python 3.12 as both run it.
  py-deps-tools:
    uses: ./.github/workflows/py-deps.yml
    with:
      name: tools-checks
      python: "3.12"
      lock: scripts/ci/locks/tools.txt

  # The core the wrapper pins, derived, never written here: a commit written by hand is a reference that changes, and a port had to remember to move it.
  # The resolver is the one release.yml uses for the core of a candidate (platform/ci/src/scripts/release_plan.py): it reads the core version the wrapper
  # pins and finds the core commit of that version, and stops, naming what it found, when it cannot. The wrapper is the caller's wrapper_ref (main for
  # the series' rounds); when the caller gives a core_ref (release.yml: the core its plan resolved) the resolver checks that one instead of the pin. Its answer is the core of the wheelhouse (`py-deps-core`) and of the checkout `rebuilds` runs the core's checks from.
  core-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      core_ref: ${{ steps.core.outputs.core_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: .series
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            platform/ci/src/scripts/release_plan.py
            platform/ci/src/scripts/make_seal.py
          sparse-checkout-cone-mode: false
      - name: The core the wrapper pins
        id: core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPER_REF: ${{ inputs.wrapper_ref || 'main' }}
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          set -euo pipefail
          args=(--resolve-core-ref --wrapper-ref "$WRAPPER_REF")
          if [ -n "$CORE_REF" ]; then args+=(--core-ref "$CORE_REF"); fi
          line="$(python3 .series/platform/ci/src/scripts/release_plan.py "${args[@]}")"
          case "$line" in
            core_ref=?*) ;;
            *) echo "the resolver did not print core_ref=<ref>: $line" >&2; exit 1 ;;
          esac
          echo "$line"
          echo "$line" >> "$GITHUB_OUTPUT"

  # The wheelhouse of the core's checks: that core's dev set, from scripts/ci/locks/core-checks.txt, and the wheel of the core itself.
  py-deps-core:
    needs: core-ref
    uses: ./.github/workflows/py-deps.yml
    with:
      name: core-checks
      python: "3.12"
      lock: scripts/ci/locks/core-checks.txt
      core_ref: ${{ needs.core-ref.outputs.core_ref }}
      core_extras: dev

  rules:
    needs: py-deps-tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The wheelhouse of the run's py-deps-tools job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-tools-checks-linux
          path: ${{ runner.temp }}/py-deps
      - name: The packages, from the wheelhouse alone (no index)
        run: python -m pip install --quiet --no-index --find-links "$RUNNER_TEMP/py-deps" --require-hashes -r "$RUNNER_TEMP/py-deps/lock.txt"
      # The budget rule compares with main's budgets: origin/main must exist on pull requests and on a candidate's branch too.
      - name: Main's budgets
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: The repo's tests
        run: python -m pytest -q tools/tests
      - name: The series' rules (folders, manifests, hook budgets, workflow copies)
        run: python tools/engine.py check

  # port-07: tools/churn.json (the churn of every hunk over the eight releases before the base) is what the series and the tags give now, and the real
  # series gives the numbers of the first measurement. It reads the tags, not the tree, and of the tags only what the walk reads: the commit and the
  # trees of the nine tags (the base and the eight before it), one commit deep and without file content (`--filter=blob:none`), and the content of the
  # files the series patches (every file of every hooks.patch, and every file tools/churn.json lists), by the shas the trees give: a partial clone,
  # tens of megabytes where nine whole tags are 1.6 GB. It lives in a bare repository of its own that `actions/cache` keeps (a larger entry would
  # evict the rest of the repository's cache). The key is made by `churn.py --cache-key` from the commits tools/churn.json records and the set of
  # files: never the names of the tags, and a new hook file is another key. Every tag is checked against its recorded commit (a cache entry too: `--fetch`
  # requires the commit it recorded, and fetches nothing that is already there). A moved tag or another repository is red here, before a number is
  # read; so is a file of the series whose content the repository does not have (it is never read as absent, and never as a churn of 0).
  # TIMING (to be measured on the pull request, cold and warm, and the numbers written here). Measured on a development PC over a slow link, cold:
  # 72 s and 78 MB (the nine tags 4 s each after the first, 13 s, then 1505 files in 27 s). Estimate on a runner: cold cache, the wheelhouse and Python
  # 40 s, the fetch about 45 s, the check 15 s and the tests 60 s, about 2.5 minutes in all; warm cache, 40 s of wheelhouse, 5 s to restore the entry,
  # the check and the tests 75 s, about 2 minutes. The job runs beside `rules` and `rebuilds`, never behind them, so a cold cache keeps the round
  # within 8 minutes. A red that needs no binary shows within the first 3 minutes: from `rules` (`engine.py check` runs rule C18 offline, from the
  # committed file) and, for this job's own reds (a stale file, a moved tag, a missing file), at the end of the fetch, about 1.5 minutes.
  churn:
    needs: py-deps-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The wheelhouse of the run's py-deps-tools job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-tools-checks-linux
          path: ${{ runner.temp }}/py-deps
      - name: The packages, from the wheelhouse alone (no index)
        run: python -m pip install --quiet --no-index --find-links "$RUNNER_TEMP/py-deps" --require-hashes -r "$RUNNER_TEMP/py-deps/lock.txt"
      - name: The key of the commits tools/churn.json records
        id: tags
        shell: bash
        run: echo "key=churn-tags-$(python tools/churn.py --cache-key)" | tee -a "$GITHUB_OUTPUT"
      - name: The tags of this key
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/churn-tags.git
          key: ${{ steps.tags.outputs.key }}
      - name: The tags that are not there, one commit deep from Mozilla's repository, each against the commit tools/churn.json records
        shell: bash
        run: python tools/churn.py --source "$RUNNER_TEMP/churn-tags.git" --fetch
      - name: Keep the tags
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/churn-tags.git
          key: ${{ steps.tags.outputs.key }}
      - name: tools/churn.json is what the series gives now (byte for byte)
        shell: bash
        run: python tools/churn.py --source "$RUNNER_TEMP/churn-tags.git" --check
      # The real series at the base: three hunks against the first measurement, and the committed file. CHURN_REQUIRE_TAGS: no tags is a failure here,
      # not the skip of the plain `pytest -q tools/tests` of `rules`, which has no tags.
      - name: The real series, against the first measurement
        shell: bash
        env:
          CHURN_TAGS_REPO: ${{ runner.temp }}/churn-tags.git
          CHURN_REQUIRE_TAGS: "1"
        run: python -m pytest -q -rs -p no:cacheprovider tools/tests/test_churn.py

  # series-02: the range-diff of a port. `engine.py range-diff --decide` says whether this run is a port: mozilla_tag of this series is not main's. If it
  # is not, the job's other steps are skipped by their own condition and the job is green, with the decision in its log (`decision=not a port: ...`). If it
  # is, `range-diff --fetch --check` makes a bare repository of its own with the two tags one commit deep and no file content (`--filter=blob:none`, the
  # fetch of tools/churn.py) and the content of the files the two series patch (and the `.gitattributes` above them), builds the layer stack of main's series
  # on main's tag and of this one on its tag from those objects alone (GIT_NO_LAZY_FETCH, so nothing else is fetched), regenerates ports/range-diff.txt and
  # compares it with the committed file: red when it is missing, stale, or its first line is not `<main's tag>..<this tag>`. Main's series is read from
  # git, origin/main, never from the branch. It reads no tree and needs no package (git and the standard library), so it does not wait for the
  # wheelhouse; it is a job of its own, parallel to the others, because it is slow where `rules` is not (ci-08), and a red that needs no binary shows within
  # the first 3 minutes.
  # TIMING (to be measured on the first port PR, cold; nothing is cached). Measured on a development PC (Windows, the tags already fetched): the two stacks 60 s
  # each, the whole command 126 s, 341 and 340 files for the two series. On a runner, estimated: a pull request that is not a port is the checkout, Python, the
  # fetch of main and the decision, about 20 s; a port adds the two tags (about 15 s), the files of the two series (about 30 s each, tens of megabytes), the two
  # stacks (about 40 s each) and the range-diff (about 10 s), about 3 minutes in all. Neither is behind `rules` or `rebuilds`, so the round stays within 8 minutes.
  range-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # main's series is the old series of the range-diff: it must exist on pull requests and on a candidate's branch too.
      - name: Main's series
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Is this a port (mozilla_tag moved away from main's)?
        id: decide
        shell: bash
        run: python tools/engine.py range-diff --decide --old-series origin/main | tee -a "$GITHUB_OUTPUT"
      - name: Not a port, nothing to compare
        if: steps.decide.outputs.port != 'true'
        run: echo "range-diff - not a port, this run does not move mozilla_tag, so ports/range-diff.txt is not checked (the decision is above)"
      - name: The two tags and the files of the two series, from Mozilla's repository, and ports/range-diff.txt is what they give (byte for byte)
        if: steps.decide.outputs.port == 'true'
        shell: bash
        run: python tools/engine.py range-diff --source "$RUNNER_TEMP/range-diff-tags.git" --old-series origin/main --fetch --check

  rebuilds:
    needs: [core-ref, py-deps-core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: .series
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # `materialize` also checks the tree it makes against `exported_tree` of UPSTREAM.json and stops when it is another: the series
      # is the engine, proven on every round.
      - name: The Mozilla tag from Mozilla, the series applied, the declared tree
        run: python .series/tools/engine.py materialize --into source
      # Every place the tree makes a network request (a channel, a socket transport, a UDP or TCP socket, a lookup, a speculative
      # connection) against tools/birth-ledger.json: a site the ledger does not have, a statement or a context signature that changed,
      # a lost hook, or a site that carries no context and a page can reach is red. Exit 2 is the dated open items alone (red by design:
      # a known hole nobody has decided yet). No build: the scan reads the tree this commit materializes. A port to a new tag runs the same
      # scan at the end of `engine.py port`.
      - name: The birth points of a request, against the ledger
        run: python .series/tools/births.py --tree source
      # port-04: the vendored code of a backport (hooks.patch, its checksum lines, the files it adds) is the replay of the commits
      # stored in its folder on the revision this tag vendors. Reads the tag's objects only: no build, no working tree.
      - name: The vendored backports, replayed on the Mozilla tag
        run: python .series/tools/backport_replay.py check --source source
      # hook-02 points 3 and 7 (C16, C17): a hook that is not an anchor passes no local of Mozilla's function, and none names a function of
      # ours in a top-level namespace other than mozilla. The plain `check` of the rules job sees only the lines a hunk shows; here the whole
      # function is read from the tag's objects, so a local declared above the hunk's context is seen too, and the unqualified names are
      # looked up in our own sources. Not debt: a hook that does is red.
      - name: No hook passes a local of Mozilla's function or sits in a namespace that is not ours (read from the tag)
        run: python .series/tools/engine.py hook-locals --source source
      # The core's checks that read the engine's source: pref types and readers,
      # prefs the binary reads, the Juggler contract and protocol, the WebGL
      # extension order, the font manifest. In the core's own CI they skip, as no
      # engine tree is there; here they read the tree this commit materializes,
      # on every round and on every port to a new Firefox tag. A skip fails the
      # step: it means a check did not read the tree.
      # The core is the one the wrapper pins, derived, never written here: the job `core-ref` resolves it, once, for this checkout and for the wheel of
      # `py-deps-core` (the wrapper is the caller's wrapper_ref, main for the series' rounds).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/core
          ref: ${{ needs.core-ref.outputs.core_ref }}
          path: core
          persist-credentials: false
      - name: The wheelhouse of the run's py-deps-core job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-core-checks-linux
          path: ${{ runner.temp }}/py-deps
      # The lock's packages by hash, then the core's wheel (built from this commit by py-deps) by name, without a dependency of its own: no index.
      - name: The core's dev set and the core, from the wheelhouse alone (no index)
        run: |
          python -m pip install --quiet --no-index --find-links "$RUNNER_TEMP/py-deps" --require-hashes -r "$RUNNER_TEMP/py-deps/lock.txt"
          python -m pip install --quiet --no-index --no-deps --find-links "$RUNNER_TEMP/py-deps" invisible_core
      - name: The core's checks, against this tree
        working-directory: core
        shell: bash
        env:
          STEALTH_FIREFOX_SRC: ${{ github.workspace }}/source
        run: |
          # The full sha, not HEAD: the core strips "<commit>:" from git grep lines.
          export STEALTH_FIREFOX_COMMIT="$(git -C "$STEALTH_FIREFOX_SRC" rev-parse HEAD)"
          python -m pytest -q -rs --junitxml=../core-checks.xml \
            tests/test_pref_types.py tests/test_prefs_surface.py \
            tests/test_juggler_contract.py tests/test_juggler_protocol_mirror.py \
            tests/test_webgl_extensions_follow_the_engine.py
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("../core-checks.xml").getroot().iter("testsuite")
          counts = [(int(s.get("tests")), int(s.get("skipped"))) for s in suite]
          tests, skipped = sum(t for t, _ in counts), sum(s for _, s in counts)
          print("core checks: %d tests, %d skipped" % (tests, skipped))
          if not tests or skipped:
              print("::error::a core check skipped or none ran: it did not read this tree")
              sys.exit(1)
          EOF

  # Every commit, annotated tag and tagger this event makes public must carry a GitHub
  # noreply address. Inline, not `uses:` of another repository's workflow: no job of a workflow a pull request
  # starts may call one (test_node_jobs_find_their_scripts.py). The steps
  # are those of oss-invisible/core's reusable workflow; the judge is read from main of
  # the core, never from the judged branch, and its absence there is an error. On a candidate the event is
  # push, schedule or workflow_dispatch: the judge takes the last of them as `other` and judges the commits the branch adds to main.
  noreply-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The repository being judged, with all its history: the range of commits is
      # computed against its refs. Commits and tags only (`tree:0`) and no file but
      # .github, the script of the export rule and its classes: with its trees this repository is about 5 GB and the clone did not
      # finish in 5 minutes (run 44708578369); without them about 300 MB.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            /.github/
            /platform/ci/src/scripts/ci/export_commit_names.py
            /tools/export_paths.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/core
          ref: main
          path: .noreply-judge
          sparse-checkout: scripts/ci_noreply_identity.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: every address is a GitHub noreply one
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          script=.noreply-judge/scripts/ci_noreply_identity.py
          if [ ! -f "$script" ]; then
            echo "the judge $script is missing from main of oss-invisible/core" >&2
            exit 1
          fi
          case "$EVENT" in
            pull_request|pull_request_target)
              python3 "$script" --event pull_request --base "$BASE_SHA" --head "$HEAD_SHA" --base-ref "$BASE_REF"
              ;;
            push)
              python3 "$script" --event push --ref "$REF" --before "$BEFORE" --after "$AFTER"
              ;;
            *)
              python3 "$script" --event other --head "$SHA" --default-ref "$DEFAULT_BRANCH"
              ;;
          esac
      # RULE export commits are named export: a commit that touches only paths the export writes and nobody edits (pure: <folder>/src/**, hooks.patch, SERIES,
      # UPSTREAM.json, the budget files, gtest-suites.json, the workflow copies) has a subject that starts with `export: `, and a commit whose subject starts with `export:`
      # touches only pure paths or mixed ones, the files the export writes and a hand adds to (HOOKS.json, MANIFEST.json, FEATURE.md) (scripts/ci/export_commit_names.py,
      # called by its exported path: the series' own copy of this file is the same one; the classes are tools/export_paths.py, which the sparse checkout above holds). The range is the commits THIS event adds: a pull request, base..head; a push, before..after (the
      # last commit when the branch is new); a schedule or a dispatch, what the ref adds to the default branch, as the judge above takes `other`. A merge and
      # a commit with no file are not judged; a range that cannot be read is red, never a pass.
      - name: export commits are named export:, and only they
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          script=platform/ci/src/scripts/ci/export_commit_names.py
          if [ ! -f "$script" ]; then
            echo "the rule's script $script is missing from this commit" >&2
            exit 1
          fi
          case "$EVENT" in
            pull_request|pull_request_target)
              range="$BASE_SHA..$HEAD_SHA"
              ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                range="$BEFORE..$AFTER"
              else
                range="HEAD~1..HEAD"
              fi
              ;;
            *)
              range="origin/$DEFAULT_BRANCH..$SHA"
              ;;
          esac
          echo "judging $range"
          python3 "$script" --repo . --range "$range"

  # Everything that does not depend on the binary, BEFORE a node is turned on: a server is an hour paid whatever it does, and a run whose
  # asset names disagree, whose Juggler's tests are red or whose release scripts do not refuse what they must, used to learn it on the node,
  # minutes after it had been ordered (run 43156862361: «Juggler's tests without a browser», in the build, 7.9 minutes of a paid hour). The
  # source tree is materialized here on its own runner, in parallel with `rebuilds` and with the release's `plan`: the cost is a GitHub
  # runner's minutes and no later start.
  tree:
    name: tree
    needs: py-deps-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      # The Python of the wheelhouse (py-deps-tools: 3.12, setup-python's), and the wheelhouse itself; the pytest step below installs from it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The wheelhouse of the run's py-deps-tools job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-tools-checks-linux
          path: ${{ runner.temp }}/py-deps
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into .
      # THE JUNIT OF OUR PYTHON TESTS OF THE TREE, for the named hook tests judge (`py:<path>::<name>`): the part `junitpart-py-checks` of the artifact
      # `junit-py`, which the job `junit-py` of release.yml puts together with the part of package-ab (the series' tools/tests). Ours only (scripts/ci/py_junit.py: the
      # files the series adds, with something for pytest to collect), run from the tree's root so a classname is the path in the tree. First after the
      # materialize, so that no later step that fails hides it; it is a test like the others: a failed or errored test turns this job red now (the judge is
      # red for a named test that did not pass as well), and its upload runs whatever happened.
      - name: Our python tests of the tree, as junit
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p junit-py/checks
          python3 -m pip install --quiet --no-index --find-links "$RUNNER_TEMP/py-deps" --require-hashes -r "$RUNNER_TEMP/py-deps/lock.txt"
          FILES="$(python3 scripts/ci/py_junit.py list --series .series --tree .)"
          # The plan's own tests that hooks name (scripts/ci/ is left out of the list above): the step below runs them as plain scripts, its verdict; here they
          # are the record, in this junit, and the `ran` step below covers them.
          FILES="$FILES scripts/ci/test_stealth_build_tools.py scripts/ci/test_stealth_download_watchdog.py scripts/ci/test_objects_first.py scripts/test_release_plan.py"
          python3 -m pytest $FILES -q -p no:cacheprovider -o addopts='' -o junit_family=xunit2 --rootdir=. --continue-on-collection-errors --junitxml=junit-py/checks/tree-tests.xml
      # A junit with no test that ran (every case a collection error, or none) is a red step, here and not at the judge: nobody would read it from 200 lines
      # of missing tests. The upload below runs whatever this said.
      - name: The junit holds a test that ran
        run: python3 scripts/ci/py_junit.py ran junit-py/checks/tree-tests.xml
      - name: Keep the junit (the part of this job, junitpart-py-checks)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junitpart-py-checks
          path: junit-py
          if-no-files-found: ignore
          retention-days: 14
      # What the release plan stands on, refused here and not in the plan (it plans, it does not test): the plan's known-bad inputs, the legs and their
      # asset names (scripts/ci/test_ci.py), the SDK downloader's hook (run 41205185526 idled 5 hours on a download error the pool could not carry
      # back), the compile-only step's list of directories, its errors and its fallback to one directory at a time, and the build tools' hooks
      # (python/mozbuild), through the host line of jar.py.
      - name: The plan's own tests
        shell: bash
        run: |
          python3 scripts/test_release_plan.py
          python3 scripts/ci/test_ci.py
          python3 scripts/ci/test_stealth_download_watchdog.py
          python3 scripts/ci/test_objects_first.py
          python3 scripts/ci/test_stealth_build_tools.py
      # Cheapest gate in the pipeline, guarding the most expensive failure: the asset
      # basename is hand-written in every matrix entry below and derived independently
      # on the client side. When the two disagree CI publishes one name while the
      # wrapper fetches another, so every download 404s while the build is green, the
      # archives are valid and the release page looks correct (issue #14). Fail here in
      # seconds instead of after five multi-hour builds.
      - name: Check asset names match the version this tree builds
        shell: bash
        run: python3 scripts/check_release_naming.py

      # The source the official build states (browser/config/upstream_source.txt,
      # read by the .mozconfig) must be the retail's of the version this tree
      # builds; a port that moves the base and leaves the file behind would
      # write the previous release's changeset into application.ini. Seconds,
      # here, before the build; --online also asks Mozilla's build record.
      - name: Check the declared upstream source matches the version this tree builds
        shell: bash
        run: python3 scripts/check_upstream_source.py --online

      # Our sources and our build files, read as text and in mozbuild's own sandbox: what a compiler or the backend finds only on the node, an
      # hour in (build/stealth_check_sources.py, build/stealth_check_build_files.py). Neither needs an objdir. Before `node`: no machine is rented
      # for a mozilla:: name that is not there or a source no build file lists.
      - name: Our sources and our build files - the text checks
        shell: bash
        run: |
          python3 build/stealth_check_sources.py
          python3 build/stealth_check_build_files.py

      # Juggler tested without a browser, seconds here before hours of build.
      # The channel between its two halves: a request answered from another
      # channel end's kept answers is never dispatched and nothing says so (a
      # page's "main world created" was lost that way, B286). And where it loads
      # from: never a chrome package, which a page probes by name, and every
      # resource URL a file the build installs (wrapper issue #336).
      - name: Juggler's tests without a browser
        shell: bash
        # The files, expanded by the shell: from Node 21 the arguments of
        # --test are file patterns, and a directory is loaded as a module.
        # One process and one junit per file, at junit-node/<tree path>.xml: the named hook tests judge (`hook-tests-judge`) reads which file
        # each test is in from the name of the junit, whatever the reporter writes. Every file runs, and the step is red if any did.
        run: |
          rc=0
          for f in juggler/tests/*.test.mjs; do
            mkdir -p "junit-node/$(dirname "$f")"
            node --test --test-reporter=spec --test-reporter-destination=stdout               --test-reporter=junit --test-reporter-destination="junit-node/$f.xml" "$f" || rc=1
          done
          exit "$rc"

      # Every suite of the wrapper's list has its legs in the gate. The list (ci/required-suites.json) is the wrapper's and the matrix of the gate's
      # `wrapper-e2e` job is written by hand: run 44834434976 learned that wrapper.e2e.fakeweb had no leg only from `wrapper-e2e-complete`, after the build.
      - name: The wrapper's list of required suites has a leg in the gate for each
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: ${{ inputs.wrapper_ref || 'main' }}
          path: .wrapper
          fetch-depth: 1
          sparse-checkout: ci/required-suites.json
      - name: Every suite of the list has its legs in gate.yml
        shell: bash
        run: python3 scripts/ci/gate_legs.py --required .wrapper/ci/required-suites.json

      # The release scripts' own known-bad inputs: validate_release.py's
      # retail-updater and no-juggler-name checks, and make_seal.py's refusals. A
      # check that has only ever printed its OK line is not a gate.
      - name: The release scripts refuse what they must
        shell: bash
        run: |
          python3 scripts/validate_release.py --selftest
          python3 scripts/test_make_seal.py
          python3 scripts/test_check_upstream_source.py
          python3 scripts/test_toolchain_parity.py
          python3 scripts/test_upstream_toolchain.py
          python3 scripts/test_memory_watch.py
          python3 scripts/test_cpu_watch.py
          python3 scripts/test_workflow_cache_rules.py
      # The junit of Juggler's tests, for `hook-tests-judge`: a hook that names `node:<path>#<title>` is judged on it.
      - name: Keep the junit of Juggler's tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-node
          path: junit-node
          if-no-files-found: ignore
          retention-days: 14
